# Tessera: Android build
# Builds a signed APK from index.html with a Capacitor 6 shell.
# On "release: published" the APK is attached to that release (for Obtainium).
# On a manual run it is uploaded as a workflow artifact.
#
# NEVER change APP_ID, the keystore below, or its password and alias.
# A different key or appId means existing installs can no longer be updated.

name: Build Android APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: app.tessera
  APP_NAME: Tessera
  KS_ALIAS: tessera
  KS_PASS: tesseracca5cb81d887d529b784ce54
  # Release keystore (PKCS12), base64. Public on purpose: acceptable for a
  # private app outside the Play Store. See README to move it into secrets.
  KS_B64: 

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          set -euo pipefail
          test -f index.html || { echo "index.html missing in repo root"; exit 1; }
          if grep -q '<script id="saved-data" type="application/json">' index.html \
             && ! grep -q '<script id="saved-data" type="application/json">null</script>' index.html; then
            echo "index.html contains embedded personal data (a backup file). Refusing to build."; exit 1
          fi
          mkdir -p www
          cp index.html www/index.html
          npm init -y > /dev/null
          npm install --no-audit --no-fund \
            @capacitor/core@6 @capacitor/android@6 @capacitor/filesystem@6 \
            @capacitor/share@6 @capacitor/cli@6
          cat > capacitor.config.json <<JSON
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "www"
          }
          JSON
          npx cap add android
          # Camera for scanning codes in person. Not required, so phones without one can install.
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$M"
          grep -E 'CAMERA|hardware.camera' "$M"
          npx cap sync android

      - name: Draw icons
        run: |
          set -euo pipefail
          pip install --break-system-packages --quiet pillow
          python3 - <<'PY'
          import os, re
          from PIL import Image, ImageDraw

          BLUE = (59, 100, 173, 255)     # --accent #3b64ad
          WHITE = (255, 255, 255, 255)
          RES = "android/app/src/main/res"

          def full(size, round_=False):
              # Same mark as the favicon: blue square, white vertical line.
              s = size * 4
              im = Image.new("RGBA", (s, s), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              if round_:
                  d.ellipse([0, 0, s - 1, s - 1], fill=BLUE)
              else:
                  d.rectangle([0, 0, s, s], fill=BLUE)
              w = max(4, round(s * 2 / 32))
              top, bot = round(s * 5 / 32), round(s * 27 / 32)
              if round_:
                  top, bot = round(s * 7 / 32), round(s * 25 / 32)
              d.rectangle([s // 2 - w // 2, top, s // 2 - w // 2 + w, bot], fill=WHITE)
              return im.resize((size, size), Image.LANCZOS)

          def foreground(size):
              # Adaptive icon layer: 108dp canvas, ~72dp visible.
              s = size * 4
              im = Image.new("RGBA", (s, s), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              vis = s * 72 / 108
              w = max(4, round(vis * 2 / 32))
              h = vis * 22 / 32 * 0.85        # keep inside the 66dp safe zone
              d.rectangle([s // 2 - w // 2, round(s / 2 - h / 2),
                           s // 2 - w // 2 + w, round(s / 2 + h / 2)], fill=WHITE)
              return im.resize((size, size), Image.LANCZOS)

          def splash(wd, ht):
              im = Image.new("RGBA", (wd, ht), WHITE)
              ic = full(max(48, min(wd, ht) // 5))
              im.paste(ic, ((wd - ic.width) // 2, (ht - ic.height) // 2), ic)
              return im

          n = 0
          for root, _, files in os.walk(RES):
              for f in files:
                  p = os.path.join(root, f)
                  if f in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png", "splash.png"):
                      w, h = Image.open(p).size
                      if f == "ic_launcher.png":            img = full(w)
                      elif f == "ic_launcher_round.png":    img = full(w, round_=True)
                      elif f == "ic_launcher_foreground.png": img = foreground(w)
                      else:                                  img = splash(w, h)
                      img.save(p); n += 1
          bg = os.path.join(RES, "values", "ic_launcher_background.xml")
          if os.path.exists(bg):
              t = open(bg).read()
              t = re.sub(r"#[0-9A-Fa-f]{6,8}", "#3B64AD", t)
              open(bg, "w").write(t)
          print(f"replaced {n} images")
          if n == 0:
              raise SystemExit("no icon files found")
          PY

      - name: Set version
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          NAME="${TAG#v}"
          [ -n "$NAME" ] || NAME="0.0.${{ github.run_number }}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${NAME}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KS_B64" | base64 -d > release.p12
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          TAG="${{ github.event.release.tag_name }}"
          OUT="tessera-${TAG:-build${{ github.run_number }}}.apk"
          "$BT/apksigner" sign --ks release.p12 --ks-type PKCS12 \
            --ks-key-alias "$KS_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out "$OUT" aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$APK" --clobber

      - name: Upload artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: tessera-apk
          path: ${{ env.APK }}
