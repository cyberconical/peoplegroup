<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Tessera</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%233b64ad'/%3E%3Cpath d='M16 5v22' stroke='%23ffffff' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fff;--ink:#111318;--mute:#6a7079;--line:#e3e6ea;--accent:#3b64ad;--tint:#e9eff9;--land:#f1f4f8;--err:#b3261e;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.42 var(--sans);-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;min-height:100dvh;padding:0 20px calc(92px + env(safe-area-inset-bottom))}
#top{padding:calc(22px + env(safe-area-inset-top)) 0 14px;border-bottom:1px solid var(--ink);margin-bottom:16px}
#top:empty{display:none}
h1{font:600 28px/1.05 var(--sans);letter-spacing:-.03em}
h2{font:600 21px/1.15 var(--sans);letter-spacing:-.02em}
h3{font:600 17px/1.25 var(--sans);letter-spacing:-.01em}
p+p{margin-top:6px}
strong{font-weight:600}
.lead{font-size:18px;line-height:1.35;letter-spacing:-.01em;margin:12px 0 20px}
.meta{font:12px/1.5 var(--mono);color:var(--mute)}
.meta.block{display:block}
.label{font:11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px}
.area{font:11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.met{color:var(--accent)}
.fine{font-size:13px;color:var(--mute);margin-top:24px}
.hint{font-size:13px;color:var(--mute);margin:8px 0 16px}
.empty{color:var(--mute);padding:12px 0}
.error{color:var(--err);font-size:14px;margin:8px 0}
.center{text-align:center}
label{display:block;font:11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:16px 0 0}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;min-height:44px;font:16px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:0}
input,textarea{appearance:none;-webkit-appearance:none}
textarea{resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer;border-radius:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;background:#fff;color:var(--ink);border:1px solid var(--ink);font:500 14px var(--sans);letter-spacing:.01em}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.quiet{border-color:transparent;color:var(--mute)}
.btn.block{display:flex;width:100%;margin-top:12px}
.btn[disabled]{opacity:.4;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.person{margin-top:26px}
.person-head{padding-bottom:10px;border-bottom:1px solid var(--ink)}
.flat,.request,.myflat{border-bottom:1px solid var(--line);padding:18px 0}
.myflat .request{border-bottom:0;border-top:1px solid var(--line);margin-top:14px;padding:14px 0 0}
.flat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:8px}
.flat-top h3{margin-top:4px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.terms{font:14px var(--mono)}
.quote{color:var(--mute);font-style:italic}
.status{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-top:8px}
.status.pending{color:var(--mute)}
.status.accepted{color:var(--accent)}
.arrival{margin-top:10px;padding:10px 12px;background:var(--tint)}
.pips{display:flex;gap:16px;align-items:center;font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:10px 0 2px}
.pips i{display:inline-block;width:9px;height:9px;background:var(--ink);margin-left:3px}
.pips i.h{background:#fff;border:1px solid var(--ink)}
.locator{flex:none;width:96px;height:60px;border:1px solid var(--line);background:#fff;display:block}
.loc-halo{fill:var(--accent);fill-opacity:.16}
.loc-halo.shared{fill:var(--ink);fill-opacity:.10}
.loc-dot{fill:var(--accent)}
.loc-dot.shared{fill:var(--ink)}

.list{border-top:1px solid var(--ink)}
.row-index{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;width:100%;padding:16px 0;text-align:left;background:none;border:0;border-bottom:1px solid var(--line)}
.row-index .no{font:12px var(--mono);color:var(--mute);padding-top:2px}
.row-index .body{display:grid;gap:3px;min-width:0}
.row-index .ttl{font:600 17px/1.25 var(--sans);letter-spacing:-.01em}
.row-index .sub{font:12px var(--mono);color:var(--mute)}
.row-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;padding:12px 0;text-align:left;background:none;border:0;border-bottom:1px solid var(--line)}
.name{font:600 18px/1.2 var(--sans);letter-spacing:-.01em;display:block}
.chip{font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);padding:3px 7px;white-space:nowrap}
.lines{list-style:none;padding:0;margin:0;border-top:1px solid var(--ink)}
.lines li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.segs{display:flex;border:1px solid var(--ink)}
.seg{flex:1;min-height:42px;padding:0 6px;background:#fff;border:0;border-left:1px solid var(--line);border-bottom:2px solid transparent;color:var(--ink);font:500 13px var(--sans);display:flex;align-items:center;justify-content:center;text-align:center}
.seg.on{background:var(--tint);color:var(--accent);border-bottom-color:var(--accent)}
.seg-label{flex:1;display:flex;margin:0;position:relative;text-transform:none;letter-spacing:0}
.seg-label input{position:absolute;opacity:0;pointer-events:none;width:1px;min-height:0;margin:0;padding:0}
.seg-label input:checked+.seg{background:var(--tint);color:var(--accent);border-bottom-color:var(--accent)}
.seg-label input:focus-visible+.seg{outline:2px solid var(--accent);outline-offset:-4px}
.segs>:first-child,.segs>:first-child .seg{border-left:0}
.termrow{display:grid;grid-template-columns:72px 1fr 88px;gap:8px;align-items:center;margin-top:8px}
.termrow span{font-size:14px}
.termrow input,.termrow select{margin-top:0}
.locrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qrwrap{margin:16px auto 8px;width:min(86vw,340px);border:1px solid var(--ink)}
.qr{display:block;width:100%;height:auto}

.map-slot{margin:14px 0 8px}
.map{position:relative;height:min(58vh,440px);min-height:300px;border:1px solid var(--ink);background:#fff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.map-svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.map-svg:active{cursor:grabbing}
.map-ctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column}
.map-ctl button{width:44px;height:44px;background:#fff;border:1px solid var(--ink);font:400 22px/1 var(--sans)}
.map-ctl button+button{border-top:0}
.map-btns{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.map-btns button{height:32px;padding:0 10px;background:#fff;border:1px solid var(--ink);font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.pin{cursor:pointer}
.pin .halo{fill:var(--accent);fill-opacity:.14}
.pin.shared .halo{fill:var(--ink);fill-opacity:.08}
.pin .dot{fill:#fff;stroke:var(--ink);stroke-width:1.5}
.pin.mine .dot{fill:var(--accent);stroke:var(--accent)}
.pin text{font:600 11px var(--mono);text-anchor:middle;fill:var(--ink);pointer-events:none}
.pin.mine text{fill:#fff}
.pick .ring{fill:none;stroke:var(--accent);stroke-width:2}
.pick .halo{fill:var(--accent);fill-opacity:.18}
.pick .cross{stroke:var(--accent);stroke-width:2}
.map-picker{position:absolute;inset:0;height:auto;min-height:0;border:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:11px var(--mono);letter-spacing:.04em;color:var(--mute);margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border:1.5px solid var(--ink);background:#fff;border-radius:50%}
.legend i.mine{background:var(--accent);border-color:var(--accent)}
.legend i.halo{border:0;background:var(--tint);width:14px;height:14px}

.onboard{padding-top:calc(48px + env(safe-area-inset-top))}
.mark{display:flex;align-items:center;font:600 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:32px}
.mark-glyph{position:relative;width:16px;height:16px;margin-right:10px;background:var(--accent)}
.mark-glyph::after{content:"";position:absolute;left:7px;top:-3px;bottom:-3px;width:2px;background:#fff}

#tabs{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;background:#fff;border-top:1px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:58px;background:none;border:0;color:var(--mute);font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
#tabs button[aria-current=page]{color:var(--accent)}
#tabs button[aria-current=page]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--accent)}

#sheet{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;background:rgba(17,19,24,.35);animation:fade .16s ease-out}
#sheet-body{width:100%;max-width:520px;max-height:92dvh;overflow:auto;background:#fff;border-top:2px solid var(--ink);padding:24px 20px calc(24px + env(safe-area-inset-bottom));outline:none}
#picker{position:fixed;inset:0;z-index:8;background:#fff;display:flex;flex-direction:column;animation:fade .16s ease-out}
.picker-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 20px 12px;border-bottom:1px solid var(--ink)}
.picker-bar h2{font-size:18px}
#picker-map{flex:1;min-height:0;position:relative}
.picker-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--ink)}
.picker-foot p{font:12px var(--mono);color:var(--mute)}
#deck{position:fixed;inset:0;z-index:10;background:#fff}
#deck iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);max-width:min(92vw,440px);padding:10px 14px;background:var(--ink);color:#fff;font-size:14px;opacity:0;pointer-events:none;transition:opacity .16s;z-index:20}
#toast.on{opacity:1}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .btn{min-height:40px;padding:0 12px;font-size:13px}
.scanbox{margin:14px auto 8px;width:min(80vw,300px);aspect-ratio:1;border:1px solid var(--ink);background:var(--land);overflow:hidden}
.scanbox video{display:block;width:100%;height:100%;object-fit:cover}
.codetext{margin-top:14px}
.codetext summary{font:12px var(--mono);color:var(--mute);cursor:pointer;min-height:40px;display:flex;align-items:center}
.codetext textarea{font:12px/1.4 var(--mono);word-break:break-all}
.chips{display:flex;gap:6px;flex:none}
.chip.blue{background:var(--tint);border-color:var(--accent);color:var(--accent)}
form.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
form.inline input{flex:1;min-width:0;margin-top:0}
form.inline .error{flex-basis:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pin.example .halo{fill:var(--ink);fill-opacity:.05}
.pin.example .dot{fill:#fff;stroke:var(--mute);stroke-width:1.5;stroke-dasharray:3 2.5}
.loc-halo.example{fill:var(--ink);fill-opacity:.06}
.loc-dot.example{fill:var(--mute)}
.legend i.ex{border-style:dashed;border-color:var(--mute)}
.exgroup{margin-top:18px}
.exgroup>.area{display:block;margin-bottom:2px}
.flat.example .terms{color:var(--mute)}
.chip.c-family{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.c-met{border-color:var(--mute);color:var(--mute)}
.chip.via{border-style:dotted;border-width:1.5px}
.chip.test{border-color:var(--accent);color:var(--accent)}
.person-head h2 .chip{vertical-align:middle;margin-left:6px;font-size:10px}
.flat.c-family{border-left:4px solid var(--ink);padding-left:12px}
.flat.via{border-left:3px dotted var(--ink);padding-left:12px}
.person.via .person-head{border-bottom-style:dotted}
.pin.c-family .dot{fill:var(--ink)}
.pin.c-family text{fill:#fff}
.pin.via .halo{fill:none;stroke:var(--ink);stroke-opacity:.45;stroke-dasharray:2 3}
.pin.via .dot{fill:#fff;stroke:var(--ink);stroke-width:2.2;stroke-dasharray:2 2}
.legend i.fam{background:var(--ink)}
.legend i.via{border-style:dotted;border-width:2px}
.locator{width:104px;height:66px}
.loc-dot{stroke:#fff;stroke-width:1.2;vector-effect:non-scaling-stroke}
.loc-halo{fill-opacity:.22}
.loc-dot.shared{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.loc-dot.shared.family{fill:var(--ink);stroke:#fff;stroke-width:1.2}
.loc-halo.via{fill:var(--ink);fill-opacity:.07}
.loc-dot.via{fill:#fff;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:2 1.5}
.dg{display:block;width:100%;height:auto;margin:10px 0 6px}
.dg text{font-family:var(--sans);fill:var(--ink)}
.dg .bx{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.dg .soft .bx{fill:var(--land)}
.dg .acc .bx,.dg .bx.acc{fill:var(--tint);stroke:var(--accent)}
.dg .frame{fill:none;stroke:var(--line);stroke-width:1.5}
.dg .t{font-size:12px;font-weight:600;text-anchor:middle}
.dg .s{font-size:10px;fill:var(--mute);text-anchor:middle}
.dg .h{font:600 10px var(--mono);letter-spacing:.06em;fill:var(--mute)}
.dg .l{font:600 10px var(--mono);fill:var(--accent);text-anchor:middle}
.dg .ar{stroke:var(--ink);stroke-width:1.3}
.dg .ar.dash{stroke-dasharray:4 3}
.dg .hd{fill:var(--ink)}
.dg .lane{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
.dg .ring{fill:none;stroke:var(--ink);stroke-width:1.2}
.dg .ring.dot{stroke-dasharray:2 3}
.dg .you{fill:var(--accent)}
.dg .inv{fill:#fff;font-size:11px}
.dg .halo{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view"></main>
</div>
<nav id="tabs" aria-label="Sections" hidden></nav>
<div id="sheet" hidden><div id="sheet-body" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div id="picker" hidden>
  <div class="picker-bar"><h2>Place your flat</h2><button type="button" class="btn" data-act="pickcancel">Cancel</button></div>
  <div id="picker-map"></div>
  <div class="picker-foot"><p id="picker-hint">Tap the map to set the area.</p><button type="button" class="btn primary" id="picker-ok" data-act="pickok" disabled>Use this place</button></div>
</div>
<div id="deck" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>


<script id="saved-data" type="application/json">null</script>

<script id="core">
const Core = (() => {
const CIRCLES = ['family', 'friends', 'met'];
const CIRCLE_LABEL = { family: 'Family', friends: 'Friends', met: 'Met', through: 'Through my people' };
const STATE_VERSION = 2;
const MSG_VERSION = 1;
const CODE_PREFIX = 'TSR1.';
const DAY_MS = 86400000;
const AUDIENCES = ['family', 'friends', 'met', 'through']; // through = people your people know
const PASS_TO = ['family', 'friends']; // a middleman forwards only to these circles of theirs
const INTRO_DAYS = 30;
const GATE_MESSAGE = 'You haven’t met this person yet. Meet first.';
const ID_ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function clone(x) { return JSON.parse(JSON.stringify(x)); }

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function clampInt(v, min, max) {
  const n = Math.round(Number(v));
  if (!Number.isFinite(n)) return min;
  return Math.min(max, Math.max(min, n));
}

function rand() {
  try {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] / 4294967296;
  } catch { return Math.random(); }
}

function makeId(r = rand) {
  const groups = [];
  for (let i = 0; i < 3; i++) {
    let g = '';
    for (let j = 0; j < 4; j++) g += ID_ALPHABET[Math.floor(r() * ID_ALPHABET.length)];
    groups.push(g);
  }
  return groups.join('-');
}

function uid(r = rand) {
  let s = '';
  for (let i = 0; i < 10; i++) s += '0123456789abcdefghijklmnopqrstuvwxyz'[Math.floor(r() * 36)];
  return s;
}

function toneIndex(seed, n = 6) {
  let h = 5381;
  for (let i = 0; i < seed.length; i++) h = ((h << 5) + h + seed.charCodeAt(i)) >>> 0;
  return h % n;
}

function hash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

function formatDay(v) {
  const d = new Date(v);
  return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}

function nights(from, to) { return Math.round((Date.parse(to) - Date.parse(from)) / DAY_MS); }
function isoDay(ms) { return new Date(ms).toISOString().slice(0, 10); }

function termsFor(flat, circle) { return (flat.terms && flat.terms[circle]) || { mode: 'hidden' }; }
function isShared(terms) { return !!terms && terms.mode !== 'hidden'; }

function visibleTo(flats, circle) {
  return flats.filter((f) => isShared(termsFor(f, circle))).map((f) => ({ flat: f, terms: termsFor(f, circle) }));
}

// What a contact has shared with me: each flat carries the terms for my circle.
function sharedBy(contact) {
  return (contact && Array.isArray(contact.flats) ? contact.flats : []).map((f) => ({ flat: f, terms: f.terms }));
}

function formatTerms(t) {
  if (t && t.mode === 'free') return 'Free';
  if (t && t.mode === 'price') return '€' + t.price + ' / night';
  return 'Private';
}

function flatFromForm(f, id) {
  const title = String(f.title || '').trim();
  const area = String(f.area || '').trim();
  if (!title) return { error: 'Give the flat a title.' };
  if (!area) return { error: 'Add an area, such as a neighbourhood or city.' };
  const terms = {};
  for (const c of AUDIENCES) {
    const mode = f[c + '_mode'];
    if (mode === 'price') {
      const price = Math.round(Number(String(f[c + '_price'] ?? '').replace(',', '.')));
      if (!(price > 0)) return { error: 'Set a price per night for ' + CIRCLE_LABEL[c] + ', for example 35.' };
      terms[c] = { mode: 'price', price };
    } else {
      terms[c] = { mode: mode === 'free' ? 'free' : 'hidden' };
    }
  }
  const lat = Number(f.lat), lon = Number(f.lon);
  const located = String(f.lat ?? '').trim() !== '' && String(f.lon ?? '').trim() !== ''
    && Number.isFinite(lat) && Number.isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
  return {
    flat: {
      id, title: title.slice(0, 60), area: area.slice(0, 60),
      ...(located ? { lat: snapCoord(lat), lon: snapCoord(lon) } : {}),
      rooms: clampInt(f.rooms, 1, 20), beds: clampInt(f.beds, 1, 40),
      desc: String(f.desc || '').trim().slice(0, 300), avail: String(f.avail || '').trim().slice(0, 80),
      arrival: String(f.arrival || '').trim().slice(0, 200),
      terms,
      passOn: CIRCLES.filter((c) => Array.isArray(f.passOn) && f.passOn.includes(c)),
    },
  };
}

const EE = { A1: 1.340264, A2: -0.081106, A3: 0.000893, A4: 0.003796, M: Math.sqrt(3) / 2 };
const RAD = Math.PI / 180;

function equalEarth(lat, lon) {
  const t = Math.asin(EE.M * Math.sin(lat * RAD));
  const t2 = t * t, t6 = t2 * t2 * t2;
  const x = (2 * Math.sqrt(3) * lon * RAD * Math.cos(t)) / (3 * (9 * EE.A4 * t6 * t2 + 7 * EE.A3 * t6 + 3 * EE.A2 * t2 + EE.A1));
  const y = t * (EE.A1 + EE.A2 * t2 + t6 * (EE.A3 + EE.A4 * t2));
  return { x, y };
}

const EE_Y_MAX = equalEarth(90, 0).y;

function equalEarthInverse(x, y) {
  if (!Number.isFinite(x) || !Number.isFinite(y) || Math.abs(y) > EE_Y_MAX) return null;
  let t = y;
  for (let i = 0; i < 12; i++) {
    const t2 = t * t, t6 = t2 * t2 * t2;
    const f = t * (EE.A1 + EE.A2 * t2 + t6 * (EE.A3 + EE.A4 * t2)) - y;
    const df = EE.A1 + 3 * EE.A2 * t2 + t6 * (7 * EE.A3 + 9 * EE.A4 * t2);
    t -= f / df;
  }
  const t2 = t * t, t6 = t2 * t2 * t2;
  const lam = (3 * x * (9 * EE.A4 * t6 * t2 + 7 * EE.A3 * t6 + 3 * EE.A2 * t2 + EE.A1)) / (2 * Math.sqrt(3) * Math.cos(t));
  if (Math.abs(lam) > Math.PI + 1e-9) return null;
  const phi = Math.asin(Math.max(-1, Math.min(1, Math.sin(t) / EE.M)));
  return { lat: phi / RAD, lon: lam / RAD };
}




function snapCoord(v, step = 0.05) { return Number((Math.round(v / step) * step).toFixed(2)); }

function hasCoords(f) { return Number.isFinite(f.lat) && Number.isFinite(f.lon); }

function mapPlaces(state, examples) {
  const out = [];
  for (const f of state.flats) {
    if (!hasCoords(f)) continue;
    out.push({ key: 'mine:' + f.id, kind: 'mine', flatId: f.id, contactId: null, title: f.title, area: f.area, lat: f.lat, lon: f.lon, terms: null, contactName: null });
  }
  for (const c of state.contacts) {
    if (!isMet(c)) continue;
    for (const { flat, terms } of sharedBy(c)) {
      if (!hasCoords(flat)) continue;
      out.push({ key: 'shared:' + c.id + ':' + flat.id, kind: 'shared', flatId: flat.id, contactId: c.id, title: flat.title, area: flat.area, lat: flat.lat, lon: flat.lon, terms, contactName: c.name, circle: c.circle });
    }
  }
  for (const sd of secondDegree(state, Date.now())) {
    for (const flat of sd.flats) {
      if (!hasCoords(flat)) continue;
      out.push({ key: 'via:' + sd.owner.id + ':' + flat.id, kind: 'via', flatId: flat.id, contactId: sd.owner.id, title: flat.title, area: flat.area, lat: flat.lat, lon: flat.lon, terms: flat.terms, contactName: sd.owner.name, viaName: sd.via.name, rel: sd.rel, introStatus: sd.status });
    }
  }
  if (state.showExamples && Array.isArray(examples)) {
    for (const p of examples) for (const f of p.flats) {
      if (!hasCoords(f)) continue;
      out.push({ key: 'example:' + f.id, kind: 'example', flatId: f.id, contactId: null, title: f.title, area: f.area, lat: f.lat, lon: f.lon, terms: f.terms, contactName: p.name, city: p.city });
    }
  }
  return out;
}

function unlocated(state) { return state.flats.filter((f) => !hasCoords(f)); }

function fitBounds(places) {
  if (!places.length) return null;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of places) {
    const { x, y } = equalEarth(p.lat, p.lon);
    if (x < minX) minX = x;
    if (x > maxX) maxX = x;
    if (y < minY) minY = y;
    if (y > maxY) maxY = y;
  }
  return { minX, maxX, minY, maxY };
}


/* ---------- validation ---------- */

const SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;
const DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
const isObj = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);
const str = (x) => typeof x === 'string';
const num = (x) => typeof x === 'number' && Number.isFinite(x);
const safeId = (x) => str(x) && SAFE_ID.test(x);
const isDay = (x) => str(x) && DAY_RE.test(x);
const text = (x, max) => (str(x) ? x.slice(0, max) : '');

function cleanTerms(t) {
  if (isObj(t) && t.mode === 'free') return { mode: 'free' };
  if (isObj(t) && t.mode === 'price' && Number(t.price) > 0) return { mode: 'price', price: Math.round(Number(t.price)) };
  return { mode: 'hidden' };
}

function cleanCoords(f, out) {
  if (num(f.lat) && num(f.lon) && Math.abs(f.lat) <= 90 && Math.abs(f.lon) <= 180) {
    out.lat = snapCoord(f.lat);
    out.lon = snapCoord(f.lon);
  }
  return out;
}

function cleanFlat(f) {
  if (!isObj(f) || !safeId(f.id) || !str(f.title) || !str(f.area)) return null;
  const terms = {};
  for (const c of AUDIENCES) terms[c] = cleanTerms(isObj(f.terms) ? f.terms[c] : null);
  return cleanCoords(f, {
    id: f.id, title: text(f.title, 60), area: text(f.area, 60),
    rooms: clampInt(f.rooms, 1, 20), beds: clampInt(f.beds, 1, 40),
    desc: text(f.desc, 300), avail: text(f.avail, 80), arrival: text(f.arrival, 200),
    terms,
    passOn: Array.isArray(f.passOn) ? CIRCLES.filter((x) => f.passOn.includes(x)) : [],
  });
}

// A flat as someone else shared it with me: one set of terms, no arrival notes.
function cleanSharedFlat(f) {
  if (!isObj(f) || !safeId(f.id) || !str(f.title) || !str(f.area)) return null;
  const terms = cleanTerms(f.terms);
  if (!isShared(terms)) return null;
  return cleanCoords(f, {
    id: f.id, title: text(f.title, 60), area: text(f.area, 60),
    rooms: clampInt(f.rooms, 1, 20), beds: clampInt(f.beds, 1, 40),
    desc: text(f.desc, 300), avail: text(f.avail, 80), terms,
    ...(isShared(cleanTerms(f.through)) ? { through: cleanTerms(f.through) } : {}),
  });
}

function stripThrough(f) { const { through, ...rest } = f; return rest; }

function cleanVia(v) {
  if (!isObj(v) || !isObj(v.owner) || !safeId(v.owner.id) || !str(v.owner.name) || !v.owner.name.trim()) return null;
  const flats = Array.isArray(v.flats) ? v.flats.map(cleanSharedFlat).filter(Boolean).map(stripThrough).slice(0, 20) : [];
  if (!flats.length) return null;
  return { owner: { id: v.owner.id, name: text(v.owner.name.trim(), 40) }, rel: CIRCLES.includes(v.rel) ? v.rel : 'met', flats };
}

function cleanContact(c) {
  if (!isObj(c) || !safeId(c.id) || !str(c.name) || !c.name.trim()) return null;
  const intro = isObj(c.intro) && safeId(c.intro.by) && num(c.intro.until)
    ? { by: c.intro.by, byName: text(c.intro.byName, 40), until: c.intro.until } : null;
  const status = c.status === 'intro' && intro ? 'intro' : 'met';
  if (status === 'met' && !str(c.metAt)) return null;
  const out = {
    id: c.id, name: text(c.name, 40), status, circle: CIRCLES.includes(c.circle) ? c.circle : 'met',
    note: text(c.note, 60), metAt: status === 'met' ? c.metAt : '',
    flats: Array.isArray(c.flats) ? c.flats.map(cleanSharedFlat).filter(Boolean).slice(0, 50) : [],
    via: Array.isArray(c.via) ? c.via.map(cleanVia).filter(Boolean).slice(0, 50) : [],
    bundleTs: num(c.bundleTs) ? c.bundleTs : 0,
    sentSig: text(c.sentSig, 40),
  };
  if (intro) out.intro = intro;
  if (c.demo === true) out.demo = true;
  return out;
}

function cleanAsk(a) {
  if (!isObj(a) || !safeId(a.id) || !safeId(a.contactId) || !safeId(a.aboutId) || !num(a.createdAt)) return null;
  return { id: a.id, contactId: a.contactId, aboutId: a.aboutId, aboutName: text(a.aboutName, 40), createdAt: a.createdAt, doneAt: num(a.doneAt) ? a.doneAt : 0 };
}

function cleanSentAsk(a) {
  if (!isObj(a) || !safeId(a.viaId) || !safeId(a.aboutId) || !num(a.at)) return null;
  return { viaId: a.viaId, aboutId: a.aboutId, at: a.at };
}

function cleanStay(r) {
  if (!isObj(r) || !safeId(r.id) || !safeId(r.contactId) || !safeId(r.flatId)) return null;
  if (!['pending', 'accepted', 'declined'].includes(r.status) || !isDay(r.from) || !isDay(r.to) || !num(r.createdAt)) return null;
  const out = {
    id: r.id, contactId: r.contactId, flatId: r.flatId, status: r.status, from: r.from, to: r.to,
    guests: clampInt(r.guests, 1, 20), createdAt: r.createdAt, msg: text(r.msg, 300),
  };
  if (str(r.reply)) out.reply = text(r.reply, 300);
  if (num(r.answeredAt)) out.answeredAt = r.answeredAt;
  return out;
}

function cleanRequest(r) {
  const b = cleanStay(r);
  if (!b) return null;
  b.flatTitle = text(r.flatTitle, 60);
  if (str(r.arrival)) b.arrival = text(r.arrival, 200);
  return b;
}

function cleanIncoming(r) {
  const b = cleanStay(r);
  if (!b || !str(r.name)) return null;
  b.name = text(r.name, 40);
  return b;
}

const list = (x, fn) => (Array.isArray(x) ? x.map(fn).filter(Boolean) : []);

// The one place for defaults and migration. Takes anything, returns a full state or null.
// v1 was the demo: its contacts, requests and answers came from sample people, so only
// your name, ID and own flats are carried over.
function normalize(raw) {
  if (!isObj(raw) || !isObj(raw.me) || !str(raw.me.name) || !raw.me.name.trim()) return null;
  const legacy = raw.v !== STATE_VERSION;
  const s = {
    v: STATE_VERSION,
    me: { name: raw.me.name.trim().slice(0, 40), id: safeId(raw.me.id) ? raw.me.id.slice(0, 32) : makeId() },
    flats: list(raw.flats, cleanFlat),
    contacts: legacy ? [] : list(raw.contacts, cleanContact),
    requests: legacy ? [] : list(raw.requests, cleanRequest),
    incoming: legacy ? [] : list(raw.incoming, cleanIncoming),
    introAsks: legacy ? [] : list(raw.introAsks, cleanAsk),
    sentAsks: legacy ? [] : list(raw.sentAsks, cleanSentAsk),
    showExamples: raw.showExamples !== false,
    backupAt: num(raw.backupAt) ? raw.backupAt : 0,
    updatedAt: num(raw.updatedAt) ? raw.updatedAt : 0,
  };
  const ids = new Set(s.contacts.map((c) => c.id));
  s.requests = s.requests.filter((r) => ids.has(r.contactId));
  s.incoming = s.incoming.filter((r) => ids.has(r.contactId));
  s.introAsks = s.introAsks.filter((a) => ids.has(a.contactId) && ids.has(a.aboutId));
  return s;
}

function isLegacyDemo(raw) {
  return isObj(raw) && raw.v === 1 && Array.isArray(raw.contacts) && raw.contacts.length > 0;
}

function newState(name) {
  return normalize({ v: STATE_VERSION, me: { name: String(name), id: makeId() }, flats: [], contacts: [], requests: [], incoming: [] });
}

/* ---------- messages between phones ---------- */
// Envelope: { app, v, t, from: {id, name}, ts, to?, ... }. Plain JSON for now.
// Signing and encryption will wrap exactly these objects later.

function b64urlEncode(s) {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function b64urlDecode(s) {
  const b = s.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b + '==='.slice((b.length + 3) % 4));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function encode(msg) { return CODE_PREFIX + b64urlEncode(JSON.stringify(msg)); }

function envelope(state, t, now, extra) {
  return { app: 'tessera', v: MSG_VERSION, t, from: { id: state.me.id, name: state.me.name }, ts: now, ...extra };
}

function isMet(c) { return !!c && c.status !== 'intro'; }
function introActive(c, now) { return !!c && c.status === 'intro' && !!c.intro && c.intro.until > now; }
function introDaysLeft(c, now) { return c && c.intro ? Math.max(0, Math.ceil((c.intro.until - now) / DAY_MS)) : 0; }

// Terms one contact gets for one of my flats. Introduced people get the "through" terms,
// but only while the intro is active and only if the circle of the person who introduced them may pass it on.
function audienceTerms(state, flat, c, now) {
  if (isMet(c)) return termsFor(flat, c.circle);
  if (!introActive(c, now)) return { mode: 'hidden' };
  const by = contactOf(state, c.intro.by);
  if (!isMet(by) || !(flat.passOn || []).includes(by.circle)) return { mode: 'hidden' };
  return termsFor(flat, 'through');
}

function publicFlat(flat, terms) {
  const f = { id: flat.id, title: flat.title, area: flat.area, rooms: flat.rooms, beds: flat.beds, desc: flat.desc, avail: flat.avail, terms };
  if (hasCoords(flat)) { f.lat = flat.lat; f.lon = flat.lon; }
  return f;
}

// My flats as one met contact may see them. "through" marks flats they may pass on, and on what terms.
function sharedFlatsFor(state, contact) {
  return visibleTo(state.flats, contact.circle).map(({ flat, terms }) => {
    const f = publicFlat(flat, terms);
    const th = termsFor(flat, 'through');
    if ((flat.passOn || []).includes(contact.circle) && isShared(th)) f.through = th;
    return f;
  });
}

// Flats my people allowed me to pass on, for one contact of mine. One step only:
// I never forward what was forwarded to me, and only to my Family and Friends.
function viaFor(state, contact) {
  if (!isMet(contact) || !PASS_TO.includes(contact.circle)) return [];
  const out = [];
  for (const o of state.contacts) {
    if (o.id === contact.id || !isMet(o) || (o.demo && !contact.demo)) continue;
    const flats = o.flats.filter((f) => f.through).map((f) => ({ ...stripThrough(f), terms: f.through }));
    if (flats.length) out.push({ owner: { id: o.id, name: o.name }, rel: o.circle, flats });
  }
  return out;
}

// My card: who I am, no flats yet (I don't know their circle).
function cardMsg(state, now) { return envelope(state, 'bundle', now, { flats: null }); }

// What one contact may see of my flats, terms already resolved for their circle.
function bundleMsg(state, contactId, now) {
  const c = state.contacts.find((x) => x.id === contactId);
  if (!isMet(c)) return null;
  return envelope(state, 'bundle', now, { to: c.id, flats: sharedFlatsFor(state, c), via: viaFor(state, c) });
}

function bundleSig(state, contact) { return hash(JSON.stringify([sharedFlatsFor(state, contact), viaFor(state, contact)])); }

function needsUpdate(state, contact) { return isMet(contact) && contact.sentSig !== bundleSig(state, contact); }

function markSent(state, contactId) {
  const i = state.contacts.findIndex((c) => c.id === contactId);
  if (i < 0) return state;
  const sig = bundleSig(state, state.contacts[i]);
  if (state.contacts[i].sentSig === sig) return state;
  const s = clone(state);
  s.contacts[i].sentSig = sig;
  return s;
}

function requestMsg(state, r) {
  return envelope(state, 'request', r.createdAt, {
    to: r.contactId, req: { id: r.id, flatId: r.flatId, from: r.from, to: r.to, guests: r.guests, msg: r.msg },
  });
}

function responseMsg(state, r) {
  const flat = state.flats.find((f) => f.id === r.flatId);
  const extra = { to: r.contactId, reqId: r.id, status: r.status, reply: r.reply || '' };
  if (r.status === 'accepted' && flat && flat.arrival) extra.arrival = flat.arrival;
  return envelope(state, 'response', r.answeredAt || r.createdAt, extra);
}

function introReqMsg(state, viaId, about, now) {
  return envelope(state, 'introreq', now, { to: viaId, about: { id: about.id, name: about.name } });
}

function introMsg(state, ask, now) {
  const asker = contactOf(state, ask.contactId);
  const about = contactOf(state, ask.aboutId);
  if (!asker || !about) return null;
  return envelope(state, 'intro', now, { people: [{ id: asker.id, name: asker.name }, { id: about.id, name: about.name }] });
}

const person = (p) => (isObj(p) && safeId(p.id) && str(p.name) && p.name.trim() ? { id: p.id, name: p.name.trim().slice(0, 40) } : null);

function cleanMsg(m) {
  if (!isObj(m) || m.app !== 'tessera' || m.v !== MSG_VERSION || !num(m.ts)) return null;
  if (!isObj(m.from) || !safeId(m.from.id) || !str(m.from.name) || !m.from.name.trim()) return null;
  const base = { t: m.t, ts: m.ts, from: { id: m.from.id, name: m.from.name.trim().slice(0, 40) } };
  if (m.to !== undefined) { if (!safeId(m.to)) return null; base.to = m.to; }
  if (m.t === 'bundle') {
    if (m.flats === null || m.flats === undefined) return { ...base, flats: null, via: [] };
    if (!Array.isArray(m.flats)) return null;
    return { ...base, flats: m.flats.map(cleanSharedFlat).filter(Boolean).slice(0, 50), via: Array.isArray(m.via) ? m.via.map(cleanVia).filter(Boolean).slice(0, 50) : [] };
  }
  if (m.t === 'introreq') {
    const about = person(m.about);
    if (!base.to || !about) return null;
    return { ...base, about };
  }
  if (m.t === 'intro') {
    if (!Array.isArray(m.people) || m.people.length !== 2) return null;
    const people = m.people.map(person);
    if (!people[0] || !people[1] || people[0].id === people[1].id) return null;
    return { ...base, people };
  }
  if (m.t === 'request') {
    const q = m.req;
    if (!base.to || !isObj(q) || !safeId(q.id) || !safeId(q.flatId) || !isDay(q.from) || !isDay(q.to)) return null;
    return { ...base, req: { id: q.id, flatId: q.flatId, from: q.from, to: q.to, guests: clampInt(q.guests, 1, 20), msg: text(q.msg, 300) } };
  }
  if (m.t === 'response') {
    if (!base.to || !safeId(m.reqId) || !['accepted', 'declined'].includes(m.status)) return null;
    const out = { ...base, reqId: m.reqId, status: m.status, reply: text(m.reply, 300) };
    if (str(m.arrival) && m.status === 'accepted') out.arrival = text(m.arrival, 200);
    return out;
  }
  return null;
}

// Accepts the bare code or any text that contains it (a pasted chat message).
function decode(input) {
  const m = String(input || '').match(/TSR1\.([A-Za-z0-9_-]+)/);
  if (!m) return { error: 'No Tessera code found. It starts with TSR1.' };
  let obj;
  try { obj = JSON.parse(b64urlDecode(m[1])); } catch { return { error: 'This code is damaged. Ask them to send it again.' }; }
  const msg = cleanMsg(obj);
  if (!msg) return { error: 'This code comes from a different version of Tessera or is damaged.' };
  return { msg };
}

/* ---------- state changes ---------- */

function contactOf(state, id) { return state.contacts.find((c) => c.id === id) || null; }

function pruneIncoming(s) {
  s.incoming = s.incoming.filter((r) => {
    if (r.status !== 'pending') return true;
    const c = contactOf(s, r.contactId);
    const f = s.flats.find((x) => x.id === r.flatId);
    if (c && f && c.status === 'intro') return true;
    return !!(c && f && isShared(termsFor(f, c.circle)));
  });
  return s;
}

function addContact(state, msg, circle, note, now, extra) {
  const old = contactOf(state, msg.from.id);
  if (isMet(old)) return state;
  const s = clone(state);
  const c = {
    id: msg.from.id, name: msg.from.name, status: 'met',
    circle: CIRCLES.includes(circle) ? circle : 'met',
    note: String(note || '').trim().slice(0, 60), metAt: new Date(now).toISOString(),
    flats: Array.isArray(msg.flats) ? msg.flats : [], via: Array.isArray(msg.via) ? msg.via : [],
    bundleTs: msg.ts, sentSig: '', ...(extra || {}),
  };
  if (old && old.intro) c.intro = old.intro; // remember who introduced you
  if (old) s.contacts = s.contacts.filter((x) => x.id !== old.id);
  s.contacts.unshift(c);
  return s;
}

// Asker side: ask a met contact to introduce me to someone whose flat they pass on.
function askIntro(state, viaId, about, now) {
  const via = contactOf(state, viaId);
  if (!isMet(via)) return { error: GATE_MESSAGE };
  const s = clone(state);
  s.sentAsks = s.sentAsks.filter((a) => !(a.viaId === viaId && a.aboutId === about.id));
  s.sentAsks.unshift({ viaId, aboutId: about.id, at: now });
  return { state: s, msg: introReqMsg(state, viaId, about, now) };
}

// Middleman side: introduce the two. The same code goes to both of them.
function makeIntro(state, askId, now) {
  const i = state.introAsks.findIndex((a) => a.id === askId);
  if (i < 0) return { error: 'This request is gone.' };
  const msg = introMsg(state, state.introAsks[i], now);
  if (!msg) return { error: 'One of them is no longer in your people.' };
  const s = clone(state);
  s.introAsks[i].doneAt = now;
  return { state: s, msg };
}

function setIntroUntil(state, contactId, until) {
  const i = state.contacts.findIndex((c) => c.id === contactId && c.status === 'intro');
  if (i < 0) return state;
  const s = clone(state);
  s.contacts[i].intro.until = until;
  return s;
}

// Flats I can see one step away: shared by people my people know, passed on by them.
function secondDegree(state, now) {
  const seen = new Set();
  const out = [];
  for (const via of state.contacts) {
    if (!isMet(via)) continue;
    for (const v of via.via || []) {
      const o = v.owner.id;
      if (o === state.me.id || seen.has(o) || isMet(contactOf(state, o))) continue;
      seen.add(o);
      const intro = contactOf(state, o);
      const status = intro ? (introActive(intro, now) ? 'active' : 'expired') : 'none';
      const asked = state.sentAsks.find((a) => a.aboutId === o && a.viaId === via.id) || null;
      out.push({ owner: v.owner, rel: v.rel, via, flats: v.flats, intro, status, asked, daysLeft: introDaysLeft(intro, now) });
    }
  }
  return out;
}

function setCircle(state, contactId, circle) {
  if (!CIRCLES.includes(circle)) return state;
  const i = state.contacts.findIndex((c) => c.id === contactId);
  if (i < 0 || state.contacts[i].circle === circle) return state;
  const s = clone(state);
  s.contacts[i].circle = circle;
  return pruneIncoming(s);
}

function setNote(state, contactId, note) {
  const i = state.contacts.findIndex((c) => c.id === contactId);
  if (i < 0) return state;
  const s = clone(state);
  s.contacts[i].note = String(note || '').trim().slice(0, 60);
  return s;
}

function removeContact(state, contactId) {
  if (!contactOf(state, contactId)) return state;
  const s = clone(state);
  s.contacts = s.contacts.filter((x) => x.id !== contactId);
  s.requests = s.requests.filter((r) => r.contactId !== contactId);
  s.incoming = s.incoming.filter((r) => r.contactId !== contactId);
  s.introAsks = s.introAsks.filter((a) => a.contactId !== contactId && a.aboutId !== contactId);
  s.sentAsks = s.sentAsks.filter((a) => a.viaId !== contactId && a.aboutId !== contactId);
  return s;
}

function saveFlat(state, flat) {
  const s = clone(state);
  const i = s.flats.findIndex((f) => f.id === flat.id);
  if (i >= 0) s.flats[i] = flat; else s.flats.push(flat);
  return pruneIncoming(s);
}

function deleteFlat(state, flatId) {
  const s = clone(state);
  s.flats = s.flats.filter((f) => f.id !== flatId);
  s.incoming = s.incoming.filter((r) => r.flatId !== flatId || r.status !== 'pending');
  return s;
}

function setShowExamples(state, on) {
  if (state.showExamples === !!on) return state;
  const s = clone(state);
  s.showExamples = !!on;
  return s;
}

function setName(state, name) {
  const n = String(name || '').trim().slice(0, 40);
  if (!n) return { error: 'Your name can’t be empty.' };
  const s = clone(state);
  s.me.name = n;
  return { state: s };
}

function createRequest(state, contactId, flatId, form, now) {
  const c = contactOf(state, contactId);
  if (!c) return { error: GATE_MESSAGE };
  let item = null;
  if (isMet(c)) item = sharedBy(c).find((x) => x.flat.id === flatId);
  else {
    if (!introActive(c, now)) return { error: `Your intro to ${c.name} has expired. Meet and scan each other’s codes, or ask ${c.intro.byName || 'them'} to introduce you again.` };
    const sd = secondDegree(state, now).find((x) => x.owner.id === c.id);
    const f = sd && sd.flats.find((x) => x.id === flatId);
    if (f) item = { flat: f, terms: f.terms };
  }
  if (!item) return { error: 'That flat isn’t shared with you.' };
  if (!isDay(form.from) || !isDay(form.to)) return { error: 'Choose your arrival and departure dates.' };
  if (!(nights(form.from, form.to) >= 1)) return { error: 'Departure must be after arrival.' };
  if (form.from < isoDay(now - DAY_MS)) return { error: 'Arrival can’t be in the past.' };
  const s = clone(state);
  const r = {
    id: uid(), contactId, flatId, flatTitle: item.flat.title,
    guests: clampInt(form.guests, 1, 20), from: form.from, to: form.to,
    msg: String(form.msg || '').trim().slice(0, 300), status: 'pending', createdAt: now,
  };
  s.requests.unshift(r);
  return { state: s, request: r };
}

function answerIncoming(state, id, decision, reply, now) {
  if (decision !== 'accepted' && decision !== 'declined') return { error: 'Choose accept or decline.' };
  const i = state.incoming.findIndex((r) => r.id === id);
  if (i < 0) return { error: 'This request is gone.' };
  const s = clone(state);
  s.incoming[i].status = decision;
  s.incoming[i].reply = String(reply || '').trim().slice(0, 300);
  s.incoming[i].answeredAt = now;
  return { state: s, incoming: s.incoming[i] };
}

// Apply a decoded message. inPerson: it was scanned face to face (or entered while meeting).
// Returns { state, kind, contact } or { needsAdd: msg } or { gate: name } or { error }.
function receive(state, msg, inPerson, now = Date.now()) {
  if (msg.from.id === state.me.id) return { error: 'That’s your own code. Scan theirs instead.' };
  if (msg.to && msg.to !== state.me.id) return { error: 'This message is meant for someone else.' };
  if (msg.t === 'intro' && !msg.people.some((p) => p.id === state.me.id)) return { error: 'This introduction is for other people.' };
  const c = contactOf(state, msg.from.id);
  if (!c || (!isMet(c) && msg.t === 'bundle')) {
    if (msg.t === 'bundle' && inPerson) return { needsAdd: msg, intro: c || null };
    if (c) return { state, kind: 'same', contact: c };
    return { gate: msg.from.name };
  }
  if (!isMet(c) && msg.t !== 'request' && msg.t !== 'response') return { gate: msg.from.name };
  if (!isMet(c) && msg.t === 'request' && !introActive(c, now)) {
    return { error: `${c.name}’s intro has expired. Meet and scan each other’s codes, or ask ${c.intro.byName || 'your friend'} to introduce you again.` };
  }
  const s = clone(state);
  const sc = contactOf(s, c.id);
  if (msg.t === 'bundle') {
    if (msg.flats === null || msg.ts <= c.bundleTs) return { state, kind: 'same', contact: c };
    sc.name = msg.from.name;
    sc.flats = msg.flats;
    sc.via = msg.via || [];
    sc.bundleTs = msg.ts;
    return { state: s, kind: 'bundle', contact: sc };
  }
  if (msg.t === 'introreq') {
    const about = contactOf(s, msg.about.id);
    if (!isMet(about) || about.id === c.id) return { error: `${c.name} asked for an introduction to someone who isn’t in your people.` };
    if (s.introAsks.some((a) => a.contactId === c.id && a.aboutId === about.id && !a.doneAt)) return { state, kind: 'same', contact: c };
    s.introAsks = s.introAsks.filter((a) => !(a.contactId === c.id && a.aboutId === about.id));
    s.introAsks.unshift({ id: uid(), contactId: c.id, aboutId: about.id, aboutName: about.name, createdAt: msg.ts, doneAt: 0 });
    return { state: s, kind: 'introreq', contact: c, about };
  }
  if (msg.t === 'intro') {
    const other = msg.people.find((p) => p.id !== state.me.id);
    const ex = contactOf(s, other.id);
    if (isMet(ex)) return { state, kind: 'same', contact: ex };
    const until = Math.min(msg.ts, now + DAY_MS) + INTRO_DAYS * DAY_MS;
    if (until <= now) return { error: `This introduction has run out. Ask ${c.name} to introduce you again.` };
    if (ex) {
      if (ex.intro.until >= until && ex.intro.by === c.id) return { state, kind: 'same', contact: ex };
      ex.intro = { by: c.id, byName: c.name, until: Math.max(until, ex.intro.until) };
      ex.name = other.name;
      return { state: s, kind: 'intro', contact: ex, renewed: true };
    }
    const nc = { id: other.id, name: other.name, status: 'intro', circle: 'met', note: '', metAt: '', flats: [], via: [], bundleTs: 0, sentSig: '', intro: { by: c.id, byName: c.name, until } };
    if (c.demo) nc.demo = true;
    s.contacts.push(nc);
    s.sentAsks = s.sentAsks.filter((a) => a.aboutId !== other.id);
    return { state: s, kind: 'intro', contact: nc, renewed: false };
  }
  if (msg.t === 'request') {
    const q = msg.req;
    if (s.incoming.some((r) => r.id === q.id)) return { state, kind: 'same', contact: c };
    const flat = s.flats.find((f) => f.id === q.flatId);
    if (!flat || !isShared(audienceTerms(state, flat, c, now))) return { error: `${c.name} asked for a flat you no longer share with them.` };
    s.incoming.unshift({ id: q.id, contactId: c.id, name: c.name, flatId: q.flatId, from: q.from, to: q.to, guests: q.guests, msg: q.msg, status: 'pending', createdAt: msg.ts });
    return { state: s, kind: 'request', contact: c };
  }
  if (msg.t === 'response') {
    const r = s.requests.find((x) => x.id === msg.reqId && x.contactId === c.id);
    if (!r) return { error: 'This answer is for a request that is no longer here.' };
    if (r.status === msg.status && (r.reply || '') === msg.reply && (r.arrival || '') === (msg.arrival || '')) return { state, kind: 'same', contact: c };
    r.status = msg.status;
    r.reply = msg.reply;
    r.answeredAt = msg.ts;
    if (msg.arrival) r.arrival = msg.arrival; else delete r.arrival;
    return { state: s, kind: 'response', contact: c, request: r };
  }
  return { error: 'Unknown message.' };
}

return {
  CIRCLES, CIRCLE_LABEL, GATE_MESSAGE, STATE_VERSION, esc, makeId, uid, toneIndex, formatDay, nights, isoDay,
  termsFor, isShared, visibleTo, sharedBy, formatTerms, flatFromForm,
  normalize, isLegacyDemo, newState, contactOf, addContact, setCircle, setNote, removeContact,
  AUDIENCES, INTRO_DAYS, isMet, introActive, introDaysLeft, audienceTerms, secondDegree, askIntro, makeIntro, setIntroUntil, introMsg, viaFor,
  saveFlat, deleteFlat, setName, setShowExamples, createRequest, answerIncoming,
  encode, decode, cardMsg, bundleMsg, requestMsg, responseMsg, bundleSig, needsUpdate, markSent, receive,
  equalEarth, equalEarthInverse, snapCoord, mapPlaces, unlocated, fitBounds,
};
})();
</script>

var qrcode = function() {

  /**

      _modules = function(moduleCount) {

      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {

          } else {

          }

    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

      var pos = QRUtil.getPatternPosition(_typeNumber);

          var col = pos[j];

          }

        if (b == -1) throw 'eof';
        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

          }

r:var(--blue);margin-top:4px}\n  .curve{display:none}\n  .jgrid{display:block}\n  .stage-col{display:block;margin-bottom:22px}\n  .stage-col>*+*{margin-top:9px}\n  .stage-col p{font-size:15px}\n  .chain{display:block}.chain .op{width:auto;height:30px}\n  .road{display:block;padding-top:0}.road::before{display:none}\n  .phase{padding:14px 0;border-top:1px solid var(--ink)}.phase::before{display:none}\n  #progress{position:fixed}\n  #chrome{left:0;right:0;bottom:0;height:44px;background:#fff;border-top:1px solid var(--ink);padding:0 14px;justify-content:flex-end}\n  #counter{margin-right:auto;text-align:left}\n  #zprev,#znext{display:none}\n}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}\n@media print{\n  @page{size:1280px 720px;margin:0}\n  html,body{height:auto;overflow:visible;background:#fff}\n  #viewport{position:static;overflow:visible}\n  #stage{position:static;transform:none!important;width:auto;height:auto}\n  .slide,.slide.active{display:flex!important;position:relative;inset:auto;width:1280px;height:720px;break-after:page;animation:none}\n  #chrome,#zprev,#znext,#overview,#progress{display:none!important}\n}\n<\/style>\n<\/head>\n<body tabindex=\"-1\">\n<div id=\"progress\"><i><\/i><\/div>\n<div id=\"viewport\"><div id=\"stage\">\n\n<\!-- 1 -->\n<section class=\"slide cover\" id=\"s1\" data-title=\"Tessera\">\n  <div class=\"kicker\"><span><b>01<\/b> — Cover<\/span><span>Draft · September 2026<\/span><\/div>\n  <div class=\"cover-main\">\n    <svg class=\"token\" viewBox=\"0 0 120 120\" aria-hidden=\"true\">\n      <rect x=\"6\" y=\"14\" width=\"50\" height=\"92\" fill=\"#3b64ad\"/>\n      <rect x=\"64\" y=\"14\" width=\"50\" height=\"92\" fill=\"none\" stroke=\"#111318\" stroke-width=\"2\"/>\n    <\/svg>\n    <div>\n      <h1>Tessera<\/h1>\n      <p class=\"tag\">Share your place with people you have actually met.<\/p>\n      <p class=\"sub\">A local-first way to share flats, and later tools and vehicles, only inside real acquaintance. No account, and no server that owns your data.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"cover-meta\"><span>Working title<\/span><span>For funders and developers<\/span><span>Items in <span class=\"ph\">[brackets]<\/span> are still to be filled in<\/span><\/div>\n<\/section>\n\n<\!-- 2 -->\n<section class=\"slide roomy\" id=\"s2\" data-title=\"Problem\">\n  <div class=\"kicker\"><span><b>02<\/b> — Problem<\/span><span>Who you can stay with<\/span><\/div>\n  <h2>People often need a place for weeks, and today the choice is a stranger or a friend.<\/h2>\n  <div class=\"body\">\n    <div class=\"split\">\n      <ul class=\"pts\">\n        <li><p>Workations, relocations, a new job or a long trip all need somewhere to stay for weeks, not days.<\/p><\/li>\n        <li><p>Marketplaces are built for anonymous strangers, so trust is bought with reviews, fees and deposits.<\/p><\/li>\n        <li><p>Friends are the best option, but you only find their flats by asking the right person at the right time.<\/p><\/li>\n        <li><p>Meanwhile flats, tools and vehicles often sit idle, because sharing with near-strangers feels risky.<\/p><\/li>\n      <\/ul>\n      <div style=\"align-self:center\">\n        <div class=\"spectrum\">\n          <div><span class=\"label\">Served today<\/span><b>Strangers<\/b><p>Public listings, ratings, platform fees.<\/p><\/div>\n          <div class=\"mid\"><span class=\"label\">The gap<\/span><b>People you have met<\/b><p>A party, a coworking desk, a train. Real contact, no tool for it.<\/p><\/div>\n          <div><span class=\"label\">Served today<\/span><b>Friends<\/b><p>Asked one by one, by message.<\/p><\/div>\n        <\/div>\n        <p class=\"note\" style=\"margin-top:12px\">Problem statement, to validate in interviews.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- 3 -->\n<section class=\"slide roomy\" id=\"s3\" data-title=\"Insight: meet first\">\n  <div class=\"kicker\"><span><b>03<\/b> — Insight<\/span><span>Meet first<\/span><\/div>\n  <h2>A real meeting is the cheapest trust signal there is, and no product uses it.<\/h2>\n  <div class=\"body\">\n    <div class=\"flow\">\n      <div class=\"box\"><span class=\"label\">Step 1<\/span><h3>Meet in person<\/h3><p>At a party, a coworking space, a station. Two scans.<\/p><\/div>\n      <div class=\"arr\">→<\/div>\n      <div class=\"box\"><span class=\"label\">Step 2<\/span><h3>You are connected<\/h3><p>Both devices hold each other's keys. Nobody else does.<\/p><\/div>\n      <div class=\"arr\">→<\/div>\n      <div class=\"box tint\"><span class=\"label\">Step 3<\/span><h3>Places unlock<\/h3><p>Each contact sees only what their circle allows, on your terms.<\/p><\/div>\n    <\/div>\n    <div class=\"split\" style=\"margin-top:6px\">\n      <ul class=\"pts\">\n        <li><p>Trust starts from real acquaintance, not from a profile page.<\/p><\/li>\n        <li><p>You choose a circle per person: Family, Friends or Met.<\/p><\/li>\n        <li><p>Without a meeting there is nothing to see: no search, no public listing.<\/p><\/li>\n      <\/ul>\n      <div class=\"vs\">\n        <div><span class=\"label\">Marketplace<\/span><ul><li>Everyone can find you<\/li><li>Trust is a rating<\/li><li>Platform holds the data<\/li><\/ul><\/div>\n        <div><span class=\"label\">Tessera<\/span><ul><li>Only people you met<\/li><li>Trust is a meeting<\/li><li>Data stays on devices<\/li><\/ul><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- 4 -->\n<section class=\"slide roomy\" id=\"s4\" data-title=\"Product today\">\n  <div class=\"kicker\"><span><b>04<\/b> — Product today<\/span><span>Prototype<\/span><\/div>\n  <h2>A working prototype already shows the whole loop, with the network simulated.<\/h2>\n  <div class=\"body\">\n    <div class=\"split wide-left\">\n      <ul class=\"pts\">\n        <li><p>A map of every place you can see: offline, equal-area, and places shown only as approximate areas.<\/p><\/li>\n        <li><p>Flats with terms per circle: private, free, or a price per night.<\/p><\/li>\n        <li><p>People and circles, with the meet-first rule enforced in the core logic and covered by tests.<\/p><\/li>\n        <li><p>Requests with accept or decline, and private arrival notes released only on accept.<\/p><\/li>\n      <\/ul>\n      <div style=\"align-self:start\">\n        <div class=\"tbl\" style=\"--c:1fr 1fr\">\n          <div class=\"r h\"><div>Real today<\/div><div>Simulated today<\/div><\/div>\n          <div class=\"r\"><div data-h=\"Real today\" style=\"font-weight:400\">Flats and terms<\/div><div data-h=\"Simulated today\" style=\"font-weight:400\">Other people<\/div><\/div>\n          <div class=\"r\"><div data-h=\"Real today\" style=\"font-weight:400\">Circles and the gate<\/div><div data-h=\"Simulated today\" style=\"font-weight:400\">The QR scan<\/div><\/div>\n          <div class=\"r\"><div data-h=\"Real today\" style=\"font-weight:400\">The map<\/div><div data-h=\"Simulated today\" style=\"font-weight:400\">Answers to requests<\/div><\/div>\n          <div class=\"r\"><div data-h=\"Real today\" style=\"font-weight:400\">Storage on the device<\/div><div data-h=\"Simulated today\" style=\"font-weight:400\">Any network traffic<\/div><\/div>\n        <\/div>\n        <p class=\"note\" style=\"margin-top:12px\">One HTML file. Opens offline. Nothing leaves the device.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- 5 -->\n<section class=\"slide dense\" id=\"s5\" data-title=\"Canvas overview\">\n  <div class=\"kicker\"><span><b>05<\/b> — Business canvas<\/span><span>Three layers<\/span><\/div>\n  <h2>One idea seen in three layers: what it earns, what it does to the planet, what it does to people.<\/h2>\n  <div class=\"bands\">\n    <div class=\"band eco\">\n      <div class=\"name\"><span class=\"label\">Layer A<\/span><b>Economic<\/b><\/div>\n      <p>Share your place only inside real acquaintance. Money comes from convenience layers, never from owning your data.<\/p>\n      <div class=\"chips\"><span>Segments: workationers · hosts · relocators<\/span><span>Revenue: options to test<\/span><span>Costs: small team, no data centre<\/span><\/div>\n    <\/div>\n    <div class=\"band\">\n      <div class=\"name\"><span class=\"label\">Layer B<\/span><b>Environmental<\/b><\/div>\n      <p>More use of what already exists. No new buildings and no new hardware; almost nothing to run per user.<\/p>\n      <div class=\"chips\"><span>Materials: none new<\/span><span>Use phase: idle capacity used<\/span><span>Impact to watch: rebound trips<\/span><\/div>\n    <\/div>\n    <div class=\"band\">\n      <div class=\"name\"><span class=\"label\">Layer C<\/span><b>Social<\/b><\/div>\n      <p>Trust between people rooted in real contact, owned by them and grown community by community.<\/p>\n      <div class=\"chips\"><span>Communities: seeded locally<\/span><span>Governance: open protocol<\/span><span>Risk to watch: exclusion<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- 6 -->\n<section class=\"slide dense\" id=\"s6\" data-title=\"Economic layer\">\n  <div class=\"kicker\"><span><b>06<\/b> — Layer A<\/span><span>Economic canvas<\/span><\/div>\n  <h2>Economic layer: free core sharing, paid convenience.<\/h2>\n  <div class=\"grid bmc\">\n    <div class=\"cell kp\"><div class=\"label\">Key partners<\/div><ul><li>Coworking and coliving spaces<\/li><li>Community organisers<\/li><li>Insurers, later<\/li><li>Open-source contributors<\/li><\/ul><\/div>\n    <div class=\"cell ka\"><div class=\"label\">Key activities<\/div><ul><li>Build the app and protocol<\/li><li>Security review<\/li><li>Seed communities<\/li><\/ul><\/div>\n    <div class=\"cell kr\"><div class=\"label\">Key resources<\/div><ul><li>Open protocol and code<\/li><li>Keypair identity model<\/li><li>Community relationships<\/li><\/ul><\/div>\n    <div class=\"cell vp\"><div class=\"label\">Value propositions<\/div><ul><li>Share your flat only with people you have met<\/li><li>No account, no server owning your data<\/li><li>Terms per circle<\/li><li>A map of places you can trust<\/li><\/ul><\/div>\n    <div class=\"cell cr\"><div class=\"label\">Customer relationships<\/div><ul><li>In person first: the meeting is the onboarding<\/li><li>Peer trust, light self-serve help<\/li><\/ul><\/div>\n    <div class=\"cell ch\"><div class=\"label\">Channels<\/div><ul><li>QR codes at gatherings<\/li><li>Links in any messenger<\/li><li>Installable web app<\/li><\/ul><\/div>\n    <div class=\"cell cs\"><div class=\"label\">Customer segments<\/div><ul><li>Workationers and travellers<\/li><li>Hosts with a spare room<\/li><li>Relocators<\/li><li>Later: communities and organisations<\/li><\/ul><\/div>\n    <div class=\"cell cost\"><div class=\"label\">Cost structure<\/div><ul><li>Development and design, security review, community work<\/li><li>Minimal relay hosting, with no user data stored<\/li><li>Legal and insurance research<\/li><\/ul><\/div>\n    <div class=\"cell rev\"><div class=\"label\">Revenue streams (all to test)<\/div><ul><li>Optional relay and backup subscription<\/li><li>Small fee on settled stays, later<\/li><li>Community and organisation licences<\/li><li>Partner referrals and grants<\/li><\/ul><\/div>\n  <\/div>\n<\/section>\n\n<\!-- 7 -->\n<section class=\"slide dense\" id=\"s7\" data-title=\"Environmental layer\">\n  <div class=\"kicker\"><span><b>07<\/b> — Layer B<\/span><span>Environmental canvas<\/span><\/div>\n  <h2>Environmental layer: use what already exists, and run almost nothing.<\/h2>\n  <div class=\"grid grid3\">\n    <div class=\"cell key\"><div class=\"label\">Functional value<\/div><p>Accommodation, and later tools and vehicles, from capacity that already exists. Unit: nights or hours of use per asset.<\/p><\/div>\n    <div class=\"cell\"><div class=\"label\">Materials<\/div><p>No new physical product. Uses buildings, tools and vehicles that exist, and phones people already own.<\/p><\/div>\n    <div class=\"cell\"><div class=\"label\">Production<\/div><p>Software from a small team. A small static web app, with no data centre holding user data.<\/p><\/div>\n    <div class=\"cell\"><div class=\"label\">Supplies and outsourcing<\/div><p>Static hosting and an optional stateless relay. Pick providers with clear energy disclosure (to validate). Open-source libraries.<\/p><\/div>\n    <div class=\"cell\"><div class=\"label\">Distribution<\/div><p>The app loads once, then works offline. Messages are a few kilobytes and travel by QR, link or paste.<\/p><\/div>\n    <div class=\"cell\"><div class=\"label\">Use phase<\/div><p>Most work happens on the device. Guests use homes that already stand, so idle time of shared assets goes down.<\/p><\/div>\n    <div class=\"cell\"><div class=\"label\">End of life<\/div><p>Data lives on the user's device, so there are no servers to decommission. Export and an open protocol keep data usable if Tessera stops.<\/p><\/div>\n    <div class=\"cell\"><div class=\"label\">Environmental impacts<\/div><p>Possible rebound: easier stays may cause more trips. Extra wear on shared assets. Small device energy use. All to measure.<\/p><\/div>\n    <div class=\"cell key\"><div class=\"label\">Environmental benefits<\/div><p>Higher use of existing assets, fewer new rooms or tool purchases needed, little server load. To measure in pilots.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<\!-- 8 -->\n<section class=\"slide dense\" id=\"s8\" data-title=\"Social layer\">\n  <div class=\"kicker\"><span><b>08<\/b> — Layer C<\/span><span>Social canvas<\/span><\/div>\n  <h2>Social layer: trust that people own, grown one community at a time.<\/h2>\n  <div class=\"grid grid3\">\n    <div class=\"cell key\"><div class=\"label\">Social value<\/div><p>Trust based on real acquaintance. Access to a place or a tool without a middleman. Local connection for newcomers.<\/p><\/div>\n    <div class=\"cell\"><div class=\"label\">Employees and contributors<\/div><p>A small core team plus open-source contributors. Paid work paid fairly. A published contribution guide. <span class=\"ph\">[team to fill in]<\/span><\/p><\/div>\n    <div class=\"cell\"><div class=\"label\">Governance<\/div><p>Open protocol and a published threat model. Users own their keys and data. Fee and rule changes made in the open. Legal form to decide.<\/p><\/div>\n    <div class=\"cell\"><div class=\"label\">Communities<\/div><p>Seeded in coworking, nomad, expat and festival circles. Each community sets its own norms for Family, Friends and Met.<\/p><\/div>\n    <div class=\"cell\"><div class=\"label\">Societal culture<\/div><p>Moves the default from a stranger with a rating to someone I have met. Revives the hospitality tradition the name comes from.<\/p><\/div>\n    <div class=\"cell\"><div class=\"label\">Scale of outreach<\/div><p>Starts inside one community and grows through real meetings. Not a global marketplace: growth is limited by real contact, by design.<\/p><\/div>\n    <div class=\"cell\"><div class=\"label\">End users<\/div><p>Travellers, hosts, relocators and neighbours lending tools. Works in a phone browser, with no account and plain language.<\/p><\/div>\n    <div class=\"cell\"><div class=\"label\">Social impacts<\/div><p>Risks: exclusion of people with no network, safety incidents, misuse as disguised short-term letting, scams through relayed QR codes.<\/p><\/div>\n    <div class=\"cell key\"><div class=\"label\">Social benefits<\/div><p>Cheaper, warmer moves and trips for newcomers. More use of idle space. Stronger local ties. A network people own.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<\!-- 9 -->\n<section class=\"slide dense\" id=\"s9\" data-title=\"Architecture overview\">\n  <div class=\"kicker\"><span><b>09<\/b> — Architecture<\/span><span>Local-first<\/span><\/div>\n  <h2>One stack on the device, three loops on top: meet, stay connected, share.<\/h2>\n  <div class=\"body\" style=\"gap:0\">\n    <div class=\"stack\">\n      <div class=\"head\"><div><\/div><div>Layer<\/div><div>What it does<\/div><div style=\"text-align:right\">M · C · S<\/div><\/div>\n      <div class=\"layer\"><span class=\"n\">01<\/span><b>Device and identity<\/b><span class=\"d\">Two keys generated on the phone: one to sign, one to encrypt. Your ID is a short fingerprint of both.<\/span><span class=\"loops\"><i class=\"on\">M<\/i><i class=\"on\">C<\/i><i class=\"on\">S<\/i><\/span><\/div>\n      <div class=\"layer\"><span class=\"n\">02<\/span><b>Handshake<\/b><span class=\"d\">Two scans in person: a signed offer and a signed accept. Both sides keep a receipt.<\/span><span class=\"loops\"><i class=\"on\">M<\/i><i>C<\/i><i>S<\/i><\/span><\/div>\n      <div class=\"layer\"><span class=\"n\">03<\/span><b>Local store and sync<\/b><span class=\"d\">Everything lives in the browser's storage. Updates are versioned, signed bundles; a CRDT can follow for several devices.<\/span><span class=\"loops\"><i>M<\/i><i class=\"on\">C<\/i><i class=\"on\">S<\/i><\/span><\/div>\n      <div class=\"layer\"><span class=\"n\">04<\/span><b>Transport<\/b><span class=\"d\">QR, link or paste: any messenger works. An optional mailbox relay can hold sealed messages for offline delivery.<\/span><span class=\"loops\"><i class=\"on\">M<\/i><i class=\"on\">C<\/i><i class=\"on\">S<\/i><\/span><\/div>\n      <div class=\"layer\"><span class=\"n\">05<\/span><b>Trust circles<\/b><span class=\"d\">Family, Friends, Met: private and local. They decide what each contact sees and on what terms.<\/span><span class=\"loops\"><i>M<\/i><i class=\"on\">C<\/i><i class=\"on\">S<\/i><\/span><\/div>\n      <div class=\"layer\"><span class=\"n\">06<\/span><b>Resource adapters<\/b><span class=\"d\">Flats today; tools and vehicles later, under the same sharing rules.<\/span><span class=\"loops\"><i>M<\/i><i>C<\/i><i class=\"on\">S<\/i><\/span><\/div>\n      <div class=\"layer\"><span class=\"n\">07<\/span><b>Optional settlement<\/b><span class=\"d\">Payments or deposits, added later and never required.<\/span><span class=\"loops\"><i>M<\/i><i>C<\/i><i class=\"on\">S<\/i><\/span><\/div>\n    <\/div>\n    <div class=\"center-strip\">\n      <div class=\"yes\"><span class=\"label\">Centralised: nothing required<\/span><p>No accounts, user database, public listings or search index.<\/p><\/div>\n      <div><span class=\"label\">Optional<\/span><p>Static hosting of the app, a mailbox relay, and settlement.<\/p><\/div>\n      <div><span class=\"label\">M · C · S<\/span><p>M meeting people, C staying connected, S sharing resources.<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- 10 -->\n<section class=\"slide roomy\" id=\"s10\" data-title=\"Loop 1: meeting\">\n  <div class=\"kicker\"><span><b>10<\/b> — Loop 1<\/span><span>Meeting people<\/span><\/div>\n  <h2>Two scans in person create a mutual, signed connection.<\/h2>\n  <div class=\"body\">\n    <div class=\"split\" style=\"grid-template-columns:1.35fr .65fr\">\n      <div class=\"only-wide\">\n        <svg viewBox=\"0 0 620 380\" width=\"100%\" role=\"img\" aria-label=\"Handshake between A and B: A shows a signed offer, B scans it and shows a signed accept, A scans it.\">\n          <defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#3b64ad\"/><\/marker><\/defs>\n          <rect x=\"20\" y=\"8\" width=\"150\" height=\"34\" fill=\"#fff\" stroke=\"#111318\"/><text x=\"95\" y=\"30\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\" fill=\"#111318\">A shows first<\/text>\n          <rect x=\"450\" y=\"8\" width=\"150\" height=\"34\" fill=\"#fff\" stroke=\"#111318\"/><text x=\"525\" y=\"30\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\" fill=\"#111318\">B scans first<\/text>\n          <line x1=\"95\" y1=\"42\" x2=\"95\" y2=\"372\" stroke=\"#111318\" stroke-dasharray=\"4 5\"/>\n          <line x1=\"525\" y1=\"42\" x2=\"525\" y2=\"372\" stroke=\"#111318\" stroke-dasharray=\"4 5\"/>\n          <line x1=\"99\" y1=\"96\" x2=\"519\" y2=\"96\" stroke=\"#3b64ad\" stroke-width=\"2\" marker-end=\"url(#ah)\"/>\n          <text x=\"310\" y=\"72\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"600\" fill=\"#111318\">1  Offer, shown as a QR<\/text>\n          <text x=\"310\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6a7079\">signed · 5 minutes · single use<\/text>\n          <rect x=\"360\" y=\"118\" width=\"240\" height=\"46\" fill=\"#e9eff9\" stroke=\"#3b64ad\"/>\n          <text x=\"480\" y=\"138\" text-anchor=\"middle\" font-size=\"13\" fill=\"#111318\">B checks signature and time,<\/text>\n          <text x=\"480\" y=\"155\" text-anchor=\"middle\" font-size=\"13\" fill=\"#111318\">then stores A as a contact<\/text>\n          <line x1=\"521\" y1=\"226\" x2=\"101\" y2=\"226\" stroke=\"#3b64ad\" stroke-width=\"2\" marker-end=\"url(#ah)\"/>\n          <text x=\"310\" y=\"200\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"600\" fill=\"#111318\">2  Accept, shown as a QR<\/text>\n          <text x=\"310\" y=\"218\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6a7079\">signed · binds the hash of A's offer<\/text>\n          <rect x=\"20\" y=\"246\" width=\"250\" height=\"62\" fill=\"#e9eff9\" stroke=\"#3b64ad\"/>\n          <text x=\"145\" y=\"266\" text-anchor=\"middle\" font-size=\"13\" fill=\"#111318\">A checks signature, hash and<\/text>\n          <text x=\"145\" y=\"283\" text-anchor=\"middle\" font-size=\"13\" fill=\"#111318\">expiry, stores B, and the<\/text>\n          <text x=\"145\" y=\"300\" text-anchor=\"middle\" font-size=\"13\" fill=\"#111318\">offer is used up<\/text>\n          <rect x=\"20\" y=\"326\" width=\"580\" height=\"40\" fill=\"#fff\" stroke=\"#111318\"/>\n          <text x=\"310\" y=\"351\" text-anchor=\"middle\" font-size=\"14\" fill=\"#111318\">Both keep a signed receipt · both choose a circle and a note<\/text>\n        <\/svg>\n      <\/div>\n      <ol class=\"steps only-narrow\">\n        <li><span><b>A shows an offer as a QR.<\/b> Signed, valid for 5 minutes, single use.<\/span><\/li>\n        <li><span><b>B scans it.<\/b> B checks signature and time, stores A, and shows an accept as a QR that binds the hash of A's offer.<\/span><\/li>\n        <li><span><b>A scans the accept.<\/b> A checks signature, hash and expiry, stores B, and the offer is used up.<\/span><\/li>\n        <li><span>Both keep a signed receipt and choose a circle and a note.<\/span><\/li>\n      <\/ol>\n      <div style=\"align-self:start;display:grid;gap:14px\">\n        <div class=\"box tint\"><span class=\"label\">What it gives you<\/span><p style=\"margin-top:6px\">Strong evidence of in-person contact, checked on both devices, with no server involved.<\/p><\/div>\n        <div class=\"box\"><span class=\"label\">What it does not prove<\/span><p style=\"margin-top:6px\">A QR can be photographed and relayed. Short lifetimes, single use and two-sided confirmation limit this, but it is evidence, not proof.<\/p><\/div>\n        <p class=\"note\">Status: designed in detail; today's prototype simulates the scan.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- 11 -->\n<section class=\"slide roomy\" id=\"s11\" data-title=\"Loop 2: staying connected\">\n  <div class=\"kicker\"><span><b>11<\/b> — Loop 2<\/span><span>Staying connected<\/span><\/div>\n  <h2>Sealed messages that only people you have met can read.<\/h2>\n  <div class=\"body\">\n    <div class=\"flow\">\n      <div class=\"box\"><span class=\"label\">From<\/span><h3>Your device<\/h3><p>Signs the payload, then seals it to one recipient.<\/p><\/div>\n      <div class=\"arr\">→<\/div>\n      <div class=\"box tint\"><span class=\"label\">Any channel<\/span><h3>QR · link · paste<\/h3><p>Or an optional mailbox for offline delivery.<\/p><\/div>\n      <div class=\"arr\">→<\/div>\n      <div class=\"box\"><span class=\"label\">To<\/span><h3>Their device<\/h3><p>Looks up the sender, decrypts, checks the signature.<\/p><\/div>\n    <\/div>\n    <div class=\"split wide-left\" style=\"margin-top:4px\">\n      <div>\n        <span class=\"label\">The sealed envelope<\/span>\n        <div class=\"env\" style=\"margin-top:8px\">\n          <div>from<small>sender fingerprint<\/small><\/div><div>to<small>recipient fingerprint<\/small><\/div><div>iv<small>random<\/small><\/div>\n          <div class=\"ct\">ciphertext<small>encrypted to the recipient<\/small>\n            <div class=\"inner\"><span>payload<small>bundle, request or response<\/small><\/span><span>signature<small>over the payload<\/small><\/span><\/div><\/div>\n        <\/div>\n        <p class=\"note\" style=\"margin-top:10px\">Bundle: the flats one contact may see, with terms already resolved for their circle. Request: dates, guests, message. Response: accepted or declined, with arrival notes only on accept.<\/p>\n      <\/div>\n      <ul class=\"pts\">\n        <li><p>Every message is signed and encrypted to one recipient.<\/p><\/li>\n        <li><p>An unknown sender has no keys, so nothing decrypts. Meet-first is structural, not a setting.<\/p><\/li>\n        <li><p>A newer bundle replaces an older one; repeated messages are ignored.<\/p><\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- 12 -->\n<section class=\"slide roomy\" id=\"s12\" data-title=\"Loop 3: sharing resources\">\n  <div class=\"kicker\"><span><b>12<\/b> — Loop 3<\/span><span>Sharing resources<\/span><\/div>\n  <h2>The same rules for a flat today and for a tool or a car later.<\/h2>\n  <div class=\"body\">\n    <div class=\"split wide-left\">\n      <div>\n        <div class=\"box tint\"><span class=\"label\">Asset core, the same for everything<\/span>\n          <p style=\"margin-top:6px\">Approximate place · terms per circle (private, free, price) · private notes released only on accept · bundle · request · response<\/p><\/div>\n        <div class=\"adapters\">\n          <div class=\"adapter now\"><span class=\"label\">Adapter · now<\/span><h3>Flat<\/h3><p>Rooms, beds, availability note, arrival notes.<\/p><\/div>\n          <div class=\"adapter\"><span class=\"label\">Adapter · next<\/span><h3>Tool<\/h3><p>Pick-up place, quantity, return window.<\/p><\/div>\n          <div class=\"adapter\"><span class=\"label\">Adapter · later<\/span><h3>Vehicle<\/h3><p>Calendar, fuel and damage terms, insurance notes.<\/p><\/div>\n        <\/div>\n      <\/div>\n      <ul class=\"pts\">\n        <li><p>A bundle carries only what that contact's circle may see.<\/p><\/li>\n        <li><p>The map shows a place as an area of about 5 km, never an address. Coordinates are snapped to a grid before they are saved.<\/p><\/li>\n        <li><p>Requests and answers are the same messages for every asset type.<\/p><\/li>\n        <li><p>Removing a contact removes their places from your map.<\/p><\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- 13 -->\n<section class=\"slide roomy\" id=\"s13\" data-title=\"Trust and privacy\">\n  <div class=\"kicker\"><span><b>13<\/b> — Trust and privacy<\/span><span>What is and is not central<\/span><\/div>\n  <h2>Nothing central is required. Three things are optional and replaceable.<\/h2>\n  <div class=\"body\">\n    <div class=\"tri\">\n      <div class=\"yes\"><span class=\"label\">On your device, always<\/span><ul style=\"margin-top:8px\"><li>Keys and your ID<\/li><li>Contacts and circles<\/li><li>Flats and terms<\/li><li>Requests and receipts<\/li><\/ul><\/div>\n      <div><span class=\"label\">Optional, replaceable<\/span><ul style=\"margin-top:8px\"><li>Static hosting of the app<\/li><li>A mailbox relay for offline delivery<\/li><li>Settlement: payments and deposits, later<\/li><\/ul><\/div>\n      <div><span class=\"label\">Not needed at all<\/span><ul style=\"margin-top:8px\"><li>Accounts and passwords<\/li><li>A user database<\/li><li>Public listings or a search index<\/li><\/ul><\/div>\n    <\/div>\n    <span class
