}

function contactHtml(id) {
  const c = contactOf(id);
  if (!c) return '<p class="empty">This person is no longer in your people.</p><button class="btn block" data-act="close">Close</button>';
  const first = esc(firstName(c.name));
  const now = Date.now();
  if (!Core.isMet(c)) {
    const on = Core.introActive(c, now);
    const seen = state.flats.filter((f) => Core.isShared(Core.audienceTerms(state, f, c, now)));
    return `<h2>${esc(c.name)} ${testChip(c)}</h2><p class="meta">Introduced by ${esc(c.intro.byName)} · ID ${esc(c.id)}</p>
      <p class="hint">${on ? `${plural(Core.introDaysLeft(c, now), 'day', 'days')} left. Until then you can ask each other for stays directly. Meet and scan each other’s codes to make it permanent.` : `The intro ran out. Meet ${first} and scan each other’s codes, or ask ${esc(firstName(c.intro.byName))} to introduce you again.`}</p>
      <p class="label">What ${first} sees of your flats</p>
      <ul class="lines">${on && seen.length ? seen.map((f) => `<li><span>${esc(f.title)}</span><span class="terms">${esc(Core.formatTerms(Core.termsFor(f, 'through')))}</span></li>`).join('') : `<li class="empty">${on ? 'Nothing. Set “Through my people” terms on a flat and let the circle of ' + esc(firstName(c.intro.byName)) + ' pass it on.' : 'Nothing while the intro has run out.'}</li>`}</ul>
      <button class="btn primary block" data-act="meet">Meet ${first} now</button>
      <div class="row"><button class="btn danger" data-act="removecontact" data-id="${esc(c.id)}">Remove</button><button class="btn" data-act="close">Done</button></div>`;
  }
  const seen = Core.visibleTo(state.flats, c.circle);
  const stale = Core.needsUpdate(state, c);
  const via = Core.viaFor(state, c);
  const segs = CIRCLES.map((k) => `<button type="button" class="seg${k === c.circle ? ' on' : ''}" aria-pressed="${k === c.circle}" data-act="circle" data-id="${esc(c.id)}" data-c="${k}">${LABEL[k]}</button>`).join('');
  const list = seen.length
    ? seen.map((x) => `<li><span>${esc(x.flat.title)}</span><span class="terms">${esc(Core.formatTerms(x.terms))}</span></li>`).join('')
    : `<li class="empty">Nothing yet. Set terms for the ${esc(LABEL[c.circle])} circle on one of your flats.</li>`;
  const passing = via.length ? `<p class="label">You pass on to ${first}</p><ul class="lines">${via.map((v) => `<li><span>${esc(v.owner.name)}</span><span class="terms">${plural(v.flats.length, 'flat', 'flats')}</span></li>`).join('')}</ul>` : '';
  return `<h2>${esc(c.name)} ${testChip(c)}</h2><p class="meta">${metLine(c)}</p><p class="meta">ID ${esc(c.id)}${c.intro ? ' · introduced by ' + esc(c.intro.byName) : ''}</p>
    <p class="label">Circle</p><div class="segs">${segs}</div>
    <p class="hint">Circles are private. ${first} only ever sees the terms you set for this circle.</p>
    <p class="label">What ${first} sees of your flats</p><ul class="lines">${list}</ul>
    ${passing}
    <p class="hint">${stale ? `${first} has an older version. Send an update so they see this.` : `${first} is up to date.`}</p>
    <button class="btn ${stale ? 'primary' : ''} block" data-act="sendflats" data-id="${esc(c.id)}">Send your flats to ${first}</button>
    <div class="row"><button class="btn danger" data-act="removecontact" data-id="${esc(c.id)}">Remove</button><button class="btn" data-act="close">Done</button></div>`;
}

function gateHtml(name) {
  return `<h2>Meet first</h2>
    <p class="lead">This code is from ${esc(name)}, who isn’t in your people.</p>
    <p class="hint">You can only add someone by scanning their code in person, or through an intro from someone you have met. Once you are connected, codes they send you open normally.</p>
    <button class="btn primary block" data-act="meet">Meet someone</button>
    <button class="btn quiet block" data-act="close">Close</button>`;
}

function answerHtml(id, decision) {
  const r = state.incoming.find((x) => x.id === id);
  if (!r) return '<p class="empty">This request is gone.</p><button class="btn block" data-act="close">Close</button>';
  const f = state.flats.find((x) => x.id === r.flatId);
  const acc = decision === 'accepted';
  return `<form data-form="answer" data-id="${esc(r.id)}" data-d="${decision}" novalidate>
    <h2>${acc ? 'Accept' : 'Decline'} ${esc(firstName(r.name))}’s request</h2>
    <p class="meta">${esc(f ? f.title : '')} · ${Core.formatDay(r.from)} to ${Core.formatDay(r.to)}</p>
    <label>Message to ${esc(firstName(r.name))}<textarea name="reply" rows="3" maxlength="300" placeholder="${acc ? 'See you then!' : 'Sorry, it doesn’t work that week.'}"></textarea></label>
    ${acc ? `<p class="hint">${f && f.arrival ? 'Your arrival notes are included.' : 'You have no arrival notes on this flat. Add them under Edit if they need any.'}</p>` : ''}
    <div class="row"><button class="btn primary">${acc ? 'Accept' : 'Decline'}</button><button type="button" class="btn" data-act="close">Cancel</button></div>
  </form>`;
}

function termRow(v, c, label) {
  const t = Core.termsFor(v, c);
  const opt = (val, text) => `<option value="${val}"${t.mode === val ? ' selected' : ''}>${text}</option>`;
  return `<div class="termrow"><span>${label}</span>
    <select name="${c}_mode" class="terms-mode" aria-label="${label} terms">${opt('hidden', 'Private')}${opt('free', 'Free')}${opt('price', 'Per night')}</select>
    <input name="${c}_price" type="text" inputmode="numeric" placeholder="€" value="${t.mode === 'price' ? t.price : ''}"${t.mode === 'price' ? '' : ' hidden'} aria-label="${label} price per night in euros">
  </div>`;
}

function flatFormHtml(f) {
  const v = f || { id: '', title: '', area: '', rooms: 1, beds: 1, desc: '', avail: '', arrival: '', terms: {}, passOn: [] };
  const located = Number.isFinite(v.lat) && Number.isFinite(v.lon);
  const rows = CIRCLES.map((c) => termRow(v, c, LABEL[c])).join('');
  const pass = CIRCLES.map((c) => `<label class="seg-label"><input type="checkbox" name="pass" value="${c}"${(v.passOn || []).includes(c) ? ' checked' : ''}><span class="seg">${LABEL[c]}</span></label>`).join('');
  return `<form data-form="flat" data-id="${esc(v.id)}" novalidate>
    <h2>${f ? 'Edit flat' : 'Add a flat'}</h2>
    <label>Title<input name="title" maxlength="60" value="${esc(v.title)}" placeholder="Two rooms, quiet courtyard"></label>
    <label>Area<input name="area" maxlength="60" value="${esc(v.area)}" placeholder="Neighbourhood, City"></label>
    <p class="label">Location</p>
    <div class="locrow"><span class="meta" id="loc-status">${located ? `Placed · ${v.lat.toFixed(2)}, ${v.lon.toFixed(2)}` : 'Not placed'}</span>
      <button type="button" class="btn" data-act="pickplace">${located ? 'Change' : 'Place on map'}</button></div>
    <input type="hidden" name="lat" value="${located ? v.lat : ''}"><input type="hidden" name="lon" value="${located ? v.lon : ''}">
    <p class="hint">Shown as an area of about 5 km, never as an exact address.</p>
    <div class="grid2">
      <label>Rooms<input name="rooms" type="number" min="1" max="20" inputmode="numeric" value="${v.rooms}"></label>
      <label>Beds<input name="beds" type="number" min="1" max="40" inputmode="numeric" value="${v.beds}"></label>
    </div>
    <label>Description<textarea name="desc" rows="3" maxlength="300">${esc(v.desc)}</textarea></label>
    <label>Availability<input name="avail" maxlength="80" value="${esc(v.avail)}" placeholder="Most of the year, ask first"></label>
    <p class="label">Who sees it</p>
    ${rows}
    <p class="hint">Private means that circle never sees this flat.</p>
    <p class="label">Through my people</p>
    ${termRow(v, 'through', 'Their people')}
    <p class="hint" style="margin-top:6px">Who may pass it on</p>
    <div class="segs">${pass}</div>
    <p class="hint">People in the circles you tick can pass this flat on to their own Family and Friends, on the terms above. It goes one step only, and only to people who can already see the flat. To ask for a stay, they need an intro, then have ${Core.INTRO_DAYS} days to meet you.</p>
    <label>Arrival notes<textarea name="arrival" rows="2" maxlength="200" placeholder="How to get in and where the key is">${esc(v.arrival)}</textarea></label>
    <p class="hint">Sent only when you accept a request. Never passed on.</p>
    <p class="error" role="alert" hidden></p>
    <div class="row"><button class="btn primary">Save flat</button><button type="button" class="btn" data-act="close">Cancel</button>${f ? `<button type="button" class="btn danger" data-act="deleteflat" data-id="${esc(v.id)}">Delete</button>` : ''}</div>
  </form>`;
}

function requestHtml(c, flatId) {
  let item = null;
  if (c && Core.isMet(c)) item = Core.sharedBy(c).find((x) => x.flat.id === flatId);
  else if (c) {
    const sd = Core.secondDegree(state, Date.now()).find((x) => x.owner.id === c.id);
    const f = sd && sd.status === 'active' && sd.flats.find((x) => x.id === flatId);
    if (f) item = { flat: f, terms: f.terms };
  }
  if (!item) return '<p class="empty">That flat isn’t shared with you.</p><button class="btn block" data-act="close">Close</button>';
  const min = today();
  return `<form data-form="request" data-c="${esc(c.id)}" data-f="${esc(flatId)}" novalidate>
    <h2>Request a stay</h2>
    <p class="meta">${esc(item.flat.title)} · ${esc(c.name)} · ${esc(Core.formatTerms(item.terms))}</p>
    <div class="grid2">
      <label>Arrive<input type="date" name="from" min="${min}"></label>
      <label>Leave<input type="date" name="to" min="${min}"></label>
    </div>
    <label>Guests<input type="number" name="guests" min="1" max="20" inputmode="numeric" value="1"></label>
    <label>Message<textarea name="msg" rows="3" maxlength="300" placeholder="A line about who you are and why"></textarea></label>
    <p class="error" role="alert" hidden></p>
    <div class="row"><button class="btn primary">Create request</button><button type="button" class="btn" data-act="close">Cancel</button></div>
  </form>`;
}

function sendRequest(r) {
  const c = contactOf(r.contactId);
  sendCode({
    msg: Core.requestMsg(state, r), forName: c ? c.name : '',
    title: `Send your request to ${firstName(c ? c.name : '')}`,
    lead: `Share it through any messenger, or let ${firstName(c ? c.name : '')} scan it. Their answer comes back the same way: tap Receive.`,
  });
}

function sendAnswer(r) {
  sendCode({
    msg: Core.responseMsg(state, r), forName: r.name,
    title: `Send your answer to ${firstName(r.name)}`,
    lead: r.status === 'accepted' ? 'It includes your arrival notes, so send it only to them.' : 'Share it through any messenger, or let them scan it.',
  });
}

/* ---------- how it works ---------- */

function dgBox(x, y, w, h, title, sub, cls = '') {
  return `<g class="${cls}"><rect class="bx" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/>
    <text class="t" x="${x + w / 2}" y="${y + (sub ? h / 2 - 3 : h / 2 + 4)}">${title}</text>
    ${sub ? `<text class="s" x="${x + w / 2}" y="${y + h / 2 + 11}">${sub}</text>` : ''}</g>`;
}

function dgArrow(x1, y1, x2, y2, id, label, lx, ly, cls = '') {
  return `<line class="ar ${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#${id})"/>${label ? `<text class="l" x="${lx}" y="${ly}">${label}</text>` : ''}`;
}

function dgSvg(id, h, label, body) {
  return `<svg class="dg" viewBox="0 0 340 ${h}" role="img" aria-label="${esc(label)}"><defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hd"/></marker></defs>${body}</svg>`;
}

function diagramArchitecture() {
  const phone = (y, who) => `<rect class="frame" x="10" y="${y}" width="320" height="92" rx="6"/>
    <text class="h" x="22" y="${y + 18}">${who}</text>
    ${dgBox(20, y + 30, 92, 50, 'Tessera', 'one HTML file')}
    ${dgBox(124, y + 30, 92, 50, 'Your data', 'on the device')}
    ${dgBox(228, y + 30, 92, 50, 'Backup', 'a file you keep', 'soft')}`;
  return dgSvg('m-arch', 316, 'Architecture: two phones exchange codes directly, without a server',
    phone(8, 'YOUR PHONE')
    + dgArrow(70, 104, 70, 192, 'm-arch') + dgArrow(270, 192, 270, 104, 'm-arch')
    + `<text class="l" x="170" y="140">codes</text><text class="s" x="170" y="155">QR in person,</text><text class="s" x="170" y="168">or any messenger</text>`
    + phone(196, 'THEIR PHONE').replace('Your data', 'Their data')
    + `<text class="s" x="170" y="308" style="font-weight:600">No server · no account · no tracking</text>`);
}

function diagramMeeting() {
  const a = 75, b = 265;
  return dgSvg('m-meet', 300, 'Meeting: show a code, scan it, scan back, both connected',
    `<text class="h" x="${a}" y="16" text-anchor="middle">YOU</text><text class="h" x="${b}" y="16" text-anchor="middle">THEM</text>
    <line class="lane" x1="${a}" y1="24" x2="${a}" y2="262"/><line class="lane" x1="${b}" y1="24" x2="${b}" y2="262"/>
    ${dgBox(a - 62, 34, 124, 34, '1 Show your code', 'name and ID')}
    ${dgArrow(a + 62, 51, b - 62, 92, 'm-meet', 'scan', 170, 64)}
    ${dgBox(b - 62, 84, 124, 34, '2 Pick your circle', 'Family, Friends, Met')}
    ${dgArrow(b - 62, 132, a + 62, 160, 'm-meet', 'scan back', 170, 136)}
    ${dgBox(a - 62, 150, 124, 34, '3 Pick their circle', 'their flats arrive')}
    ${dgArrow(a + 62, 196, b - 62, 214, 'm-meet', 'your flats', 170, 196)}
    ${dgBox(b - 62, 206, 124, 34, '4 Your flats arrive', 'for their circle')}
    <rect class="bx acc" x="70" y="266" width="200" height="28" rx="3"/><text class="t" x="170" y="284">Connected both ways</text>`);
}

function diagramCodes() {
  const a = 60, b = 280;
  const row = (y, dir, title, sub) => (dir > 0 ? dgArrow(a + 8, y, b - 8, y, 'm-codes') : dgArrow(b - 8, y, a + 8, y, 'm-codes'))
    + `<text class="t" x="170" y="${y - 8}">${title}</text><text class="s" x="170" y="${y + 16}">${sub}</text>`;
  return dgSvg('m-codes', 250, 'Codes: flats, request, answer, intro',

    <line class="lane" x1="${a}" y1="24" x2="${a}" y2="240"/><line class="lane" x1="${b}" y1="24" x2="${b}" y2="240"/>
    ${row(52, 1, 'Flats', 'what their circle may see, and what they may pass on')}
    ${row(110, -1, 'Request', 'dates, guests, a message')}
    ${row(168, 1, 'Answer', 'accept or decline, arrival notes only on accept')}
    <text class="s" x="170" y="222">Every code starts with TSR1. Paste a whole chat</text><text class="s" x="170" y="236">message: the app finds the code inside it.</text>`);
}

function diagramCircles() {
  const cx = 170, cy = 160;
  const ring = (r, label, terms, cls = '') => `<circle class="ring ${cls}" cx="${cx}" cy="${cy}" r="${r}"/><text class="h halo" x="${cx}" y="${cy - r + 16}" text-anchor="middle">${label}</text>${terms ? `<text class="s halo" x="${cx}" y="${cy - r + 28}">${terms}</text>` : ''}`;
  return dgSvg('m-circ', 330, 'Circles: Family, Friends and Met see your terms per circle. Through my people is one step further, via an intro.',
    ring(150, 'THROUGH MY PEOPLE', 'one step, needs an intro', 'dot')
    + ring(112, 'MET', 'their own terms')
    + ring(78, 'FRIENDS', 'their own terms')
    + ring(44, 'FAMILY', '')
    + `<circle class="you" cx="${cx}" cy="${cy + 10}" r="16"/><text class="t inv" x="${cx}" y="${cy + 14}">You</text>
    <text class="s" x="${cx}" y="322">Each flat sets terms per ring: private, free or a price.</text>`);
}

function diagramIntro() {
  return dgSvg('m-intro', 420, 'Intro: see a flat through a friend, ask for an intro, then meet within 30 days or the intro runs out',
    dgBox(70, 6, 200, 38, 'See Lea’s flat via Sam', 'Sam passes it on')
    + dgArrow(170, 44, 170, 62, 'm-intro')
    + dgBox(70, 64, 200, 38, 'Ask Sam for an intro', 'a code to Sam')

    + dgBox(70, 122, 200, 38, 'Sam introduces you', 'one code, to both of you', 'acc')
    + dgArrow(170, 160, 170, 178, 'm-intro')
    + dgBox(70, 180, 200, 38, `${Core.INTRO_DAYS} days to stay in touch`, 'ask Lea for stays directly')
    + dgArrow(130, 218, 80, 262, 'm-intro') + dgArrow(210, 218, 260, 262, 'm-intro')
    + dgBox(8, 264, 150, 44, 'Meet and scan codes', 'connected for good', 'acc')
    + dgBox(182, 264, 150, 44, `${Core.INTRO_DAYS} days pass`, 'the intro runs out', 'soft')
    + `<path class="ar dash" d="M332 286 C 345 286 345 141 282 141" marker-end="url(#m-intro)" fill="none"/>
    <text class="l" x="257" y="330">Sam reshares:</text><text class="s" x="257" y="344">${Core.INTRO_DAYS} more days</text>

function viewGuide() {
  return `<p class="lead">Tessera has no server. Your phone holds everything, and people connect by meeting and passing codes.</p>
    <p class="label">Architecture</p>${diagramArchitecture()}
    <p class="hint">The app is one file that works offline. Your flats, people and requests live in this phone’s storage. A backup is a copy of the app with your data inside.</p>

}

      terms: { family: TEST_FREE, friends: TEST_HIDDEN, met: TEST_HIDDEN, through: TEST_HIDDEN }, passOn: [] },
    { id: 't-dad-2', title: 'Holiday flat at the lake', area: 'Near Lindau harbour, Lake Constance', lat: 47.55, lon: 9.7, rooms: 2, beds: 4,
      desc: 'A balcony over the water.', avail: 'Outside the school holidays', arrival: TEST_NOTE,
      terms: { family: TEST_FREE, friends: TEST_HIDDEN, met: TEST_HIDDEN, through: TEST_HIDDEN }, passOn: [] },
  ] },
};

const testKey = (id) => Object.keys(TEST).find((k) => TEST[k].id === id) || null;

function testState(k) {
  const p = TEST[k];
  const now = Date.now();
  const long = new Date(now - 400 * 86400000).toISOString();
  const contacts = [];
  const mine = contactOf(p.id);
  if (k === 'sam') {
    for (const q of ['lea', 'jonas']) {
      contacts.push({ id: TEST[q].id, name: TEST[q].name, status: 'met', circle: TEST[q].rel, metAt: long, flats: Core.bundleMsg(testState(q), p.id, now).flats, via: [] });
    }
  }
  if (k === 'lea' || k === 'jonas') contacts.push({ id: TEST.sam.id, name: TEST.sam.name, status: 'met', circle: p.rel, metAt: long, flats: [], via: [] });
  if (mine || k === 'dad') {
    if (!mine || Core.isMet(mine)) contacts.push({ id: state.me.id, name: state.me.name, status: 'met', circle: p.meAs, metAt: long, flats: [], via: [] });
    else contacts.push({ id: state.me.id, name: state.me.name, status: 'intro', circle: 'met', metAt: '', intro: { by: TEST.sam.id, byName: TEST.sam.name, until: mine.intro.until }, flats: [], via: [] });
  }
  return Core.normalize({ v: Core.STATE_VERSION, me: { name: p.name, id: p.id }, flats: p.flats, contacts, requests: [], incoming: [], introAsks: [], sentAsks: [] });
}

function testToMeet() {
  return ['sam', 'lea', 'jonas'].filter((k) => {
    const c = contactOf(TEST[k].id);
    return k === 'sam' ? !Core.isMet(c) || !c : !!c && !Core.isMet(c);
  });
}

// A test person "receives" a code you sent and answers like a real phone would.
function testDeliver(msg) {
  const k = testKey(msg.to);
  if (!k) return;
  const name = TEST[k].name;
  const mineBefore = contactOf(TEST[k].id);
  setTimeout(() => {
    if (!state) return;
    const now = Date.now();
    const vs = testState(k);
    let reply = null;
    if (msg.t === 'bundle') {
      const c = contactOf(TEST[k].id);
      if (c && !c.flats.length && !(c.via || []).length) reply = Core.bundleMsg(vs, state.me.id, now);
      else toast(`${name} got your flats.`);
    } else if (msg.t === 'request') {
      const r = Core.receive(vs, msg, false, now);
      if (r.error) { toast(`${name}: ${r.error}`); return; }
      const a = Core.answerIncoming(r.state, msg.req.id, 'accepted', `Of course! Looking forward to it. – ${name}`, now);
      reply = Core.responseMsg(a.state, a.incoming);
    } else if (msg.t === 'introreq') {
      const r = Core.receive(vs, msg, false, now);
      if (r.error) { toast(`${name}: ${r.error}`); return; }
      reply = Core.introMsg(r.state, r.state.introAsks[0], now);
    }
    if (reply) onCode(Core.encode(reply), false, null);
  }, mineBefore ? 1200 : 600);
}

/* ---------- backup ---------- */

function buildFile() {
  const json = JSON.stringify(state).replace(/</g, '\\u003c');
  return PRISTINE.replace(/(<script id="saved-data" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json + b);
}

async function saveBackup() {
  state.backupAt = Date.now();
  persist();
  const html = buildFile();
  const name = 'tessera-backup-' + today() + '.html';
  try {
    const P = window.Capacitor && window.Capacitor.Plugins;
    if (isNative() && P && P.Filesystem && P.Share) {
      const res = await P.Filesystem.writeFile({ path: name, data: html, directory: 'CACHE', encoding: 'utf8' });
      await P.Share.share({ title: 'Tessera backup', files: [res.uri], dialogTitle: 'Save backup' });
    } else {
      const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
    render();
    toast('Backup ready. Keep it somewhere safe, and never upload it as the app.');
  } catch (e) {
    if (/cancel|abort/i.test(String(e && e.message))) { render(); return; }
    toast('Couldn’t save the backup. Try again.');
  }
}

function extractBackup(text) {
  const t = String(text || '').trim();
  if (t.startsWith('{')) return Core.normalize(parseJson(t));
  const m = t.match(/<script id="saved-data" type="application\/json">([\s\S]*?)<\/script>/);
  return m ? Core.normalize(parseJson(m[1].trim() || 'null')) : null;
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.html,.htm,.json,text/html,application/json';
  input.addEventListener('change', async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    let next = null;
    try { next = extractBackup(await file.text()); } catch {}
    if (!next) { toast('This file has no Tessera data in it.'); return; }
    const when = next.updatedAt ? Core.formatDay(next.updatedAt) : 'an unknown date';
    const what = `${plural(next.flats.length, 'flat', 'flats')} and ${plural(next.contacts.length, 'person', 'people')}`;
    if (state && !confirm(`Replace everything on this device with the backup from ${when} (${what})?`)) return;
    state = next;
    persist();
    notice = '';
    tab = 'map';
    mapNeedsFit = true;
    closeSheet();
    render();
    toast(`Backup loaded: ${what}.`);
  });
  input.click();
}

/* ---------- actions ---------- */

const actions = {
  tab: (d) => { closeSheet(); tab = d.tab; history.replaceState(null, '', '#' + tab); render(); window.scrollTo(0, 0); },
  outdeliver: () => {
    const o = outbox;
    if (!o) return;
    outboxSent();
    closeSheet();
    toast(`Delivered to ${TEST[testKey(o.msg.to)].name}.`);
    testDeliver(o.msg);
  },
  practice: () => showSheet(practiceHtml),
  practicecard: (d) => showSheet(() => practiceCardHtml(d.k)),
  simscan: (d) => onCode(Core.encode(Core.cardMsg(testState(d.k), Date.now())), true, null),
  adddad: () => {
    if (contactOf(TEST.dad.id)) return;
    const now = Date.now();
    commit(Core.addContact(state, Core.bundleMsg(testState('dad'), state.me.id, now), 'family', 'Test person', now, { demo: true }));
    toast('Dad is in your Family, with two flats.');
  },
  expireintros: () => {
    let s = state;
    for (const c of state.contacts) if (c.demo && !Core.isMet(c)) s = Core.setIntroUntil(s, c.id, Date.now() - 1000);
    commit(s);
    toast('The test intros have run out. Ask Sam again under Stays.');
  },
  removetests: () => {
    if (!confirm('Remove all test people, their flats and your requests to them?')) return;
    let s = state;
    for (const c of state.contacts) if (c.demo) s = Core.removeContact(s, c.id);
    closeSheet();
    commit(s);
    toast('Test people removed.');
  },
  askintro: (d) => {
    const sd = Core.secondDegree(state, Date.now()).find((x) => x.owner.id === d.o && x.via.id === d.via);
    if (!sd) return;
    const res = Core.askIntro(state, d.via, sd.owner, Date.now());
    if (res.error) return toast(res.error);
    commit(res.state);
    sendCode({
      msg: res.msg, forName: sd.via.name,
      title: `Ask ${firstName(sd.via.name)} for an intro`,
      lead: `${firstName(sd.via.name)} gets a request to introduce you to ${firstName(sd.owner.name)}. The intro comes back as a code: tap Receive.`,
    });
  },
  introduce: (d) => {
    const res = Core.makeIntro(state, d.id, Date.now());
    if (res.error) return toast(res.error);
    commit(res.state);
    const [p1, p2] = res.msg.people;
    sendCode({
      msg: res.msg,
      title: `Introduce ${firstName(p1.name)} and ${firstName(p2.name)}`,
      lead: `Send this one code to both of them. Each gets ${Core.INTRO_DAYS} days to ask the other for stays and to meet in person.`,
    });
  },
  close: () => closeSheet(),
  mapfilter: (d) => { mapFilter = d.f; mapNeedsFit = true; render(); },
  place: (d) => {
    const p = Core.mapPlaces(state, EXAMPLES).find((x) => x.key === d.key);
    if (p) mainMap.focus(p);
    showSheet(() => placeHtml(d.key));
  },
  placeflat: (d) => {
    const f = state.flats.find((x) => x.id === d.id);
    if (!f) return;
    openPicker(null, (lat, lon) => { commit(Core.saveFlat(state, { ...f, lat, lon })); mapNeedsFit = true; render(); toast('Placed.'); });
  },
  pickplace: () => {
    const form = $('#sheet-body form[data-form=flat]');
    if (!form) return;
    const lat = parseFloat(form.elements.lat.value);
    const lon = parseFloat(form.elements.lon.value);
    openPicker({ lat, lon }, (la, lo) => {
      form.elements.lat.value = la;
      form.elements.lon.value = lo;
      $('#loc-status').textContent = `Placed · ${la.toFixed(2)}, ${lo.toFixed(2)}`;
      form.querySelector('[data-act=pickplace]').textContent = 'Change';
    });
  },
  pickok: () => {
    const s = pickerState;
    if (!s || !s.chosen) return;
    closePicker();
    s.done(s.chosen.lat, s.chosen.lon);
  },
  pickcancel: () => closePicker(),
  deck: () => openDeck(),
  meet: () => { meet = { step: 'qr' }; showSheet(meetHtml); },
  meetscan: () => { meet = { step: 'scan' }; showSheet(meetHtml); },
  receive: () => showSheet(receiveHtml),
  outshare: async () => {
    const o = outbox;
    if (!o) return;
    const res = await shareText(shareBody(o), 'Tessera');
    if (res === 'shared') { outboxSent(); toast('Sent.'); }
    else if (res === 'copied') { outboxSent(); toast('Copied. Paste it into a message.'); }
    else if (res === 'failed') toast('Couldn’t share. Use Show the code and copy it by hand.');
  },
  outcopy: async () => {
    const o = outbox;
    if (!o) return;
    if (await copyText(shareBody(o))) { outboxSent(); toast('Copied. Paste it into a message.'); }
    else toast('Couldn’t copy. Use Show the code and copy it by hand.');
  },
  outdone: () => { outboxSent(); closeSheet(); },
  contact: (d) => showSheet(() => contactHtml(d.id)),
  circle: (d) => { commit(Core.setCircle(state, d.id, d.c)); paintSheet(); },
  sendflats: (d) => sendBundle(d.id, false),
  removecontact: (d) => {
    const c = contactOf(d.id);
    if (!c || !confirm(`Remove ${c.name}? Their flats and your requests to them disappear. Flats you already sent them stay on their phone.`)) return;
    commit(Core.removeContact(state, d.id));
    closeSheet();
    toast('Removed.');
  },
  addflat: () => showSheet(() => flatFormHtml(null)),
  editflat: (d) => showSheet(() => flatFormHtml(state.flats.find((f) => f.id === d.id))),
  deleteflat: (d) => {
    if (!confirm('Delete this flat? Open requests for it disappear.')) return;
    commit(Core.deleteFlat(state, d.id));
    closeSheet();
    toast('Deleted. Send updates under People so others see it’s gone.');
  },
  answer: (d) => showSheet(() => answerHtml(d.id, d.d)),
  resendanswer: (d) => { const r = state.incoming.find((x) => x.id === d.id); if (r) sendAnswer(r); },
  resendrequest: (d) => { const r = state.requests.find((x) => x.id === d.id); if (r) sendRequest(r); },
  request: (d) => { const c = contactOf(d.c); showSheet(() => requestHtml(c, d.f)); },
  toggleexamples: () => {
    const on = !state.showExamples;
    if (!on && mapFilter === 'example') mapFilter = 'all';
    mapNeedsFit = true;
    if (!on) closeSheet();
    commit(Core.setShowExamples(state, on));
    toast(on ? 'Example places are on.' : 'Example places are hidden. Bring them back under You.');
  },
  savebackup: () => saveBackup(),
  importbackup: () => importBackup(),
  clear: () => {
    if (!confirm('Clear all data on this device? Without a backup, your flats and people are gone for good.')) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    state = null;
    notice = '';
    mapNeedsFit = true;
    render();
  },
};

const forms = {
  onboard: (fd, form) => {
    const name = String(fd.get('name') || '').trim();
    if (!name) return formError(form, 'Tell us what to call you. A first name or a nickname is fine.');
    state = Core.newState(name);
    tab = 'map';
    mapNeedsFit = true;
    persist();
    render();
  },
  name: (fd, form) => {
    const r = Core.setName(state, fd.get('name'));
    if (r.error) return formError(form, r.error);
    commit(r.state);
    toast('Saved. People see the new name with your next code.');
  },
  paste: (fd, form) => onCode(fd.get('code'), form.dataset.mode === 'meet', form),
  meetadd: (fd) => {
    const m = meet.msg;
    commit(Core.addContact(state, m, fd.get('circle'), fd.get('note'), Date.now(), testKey(m.from.id) ? { demo: true } : null));
    meet = null;
    toast(`${firstName(m.from.name)} is in your people.`);
    sendBundle(m.from.id, true);
  },
  flat: (fd, form) => {
    const res = Core.flatFromForm({ ...Object.fromEntries(fd), passOn: fd.getAll('pass') }, form.dataset.id || Core.uid());
    if (res.error) return formError(form, res.error);
    commit(Core.saveFlat(state, res.flat));
    closeSheet();
    const stale = state.contacts.filter((c) => Core.needsUpdate(state, c)).length;
    toast(stale ? `Saved. Send updates under People: ${plural(stale, 'person', 'people')} have an older version.` : 'Saved.');
  },
  request: (fd, form) => {
    const res = Core.createRequest(state, form.dataset.c, form.dataset.f, Object.fromEntries(fd), Date.now());
    if (res.error) return formError(form, res.error);
    tab = 'stays';
    history.replaceState(null, '', '#stays');
    commit(res.state);
    sendRequest(res.request);
  },
  answer: (fd, form) => {
    const res = Core.answerIncoming(state, form.dataset.id, form.dataset.d, fd.get('reply'), Date.now());
    if (res.error) return formError(form, res.error);
    commit(res.state);
    sendAnswer(res.incoming);
  },
};

/* ---------- events and boot ---------- */

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el) { const fn = actions[el.dataset.act]; if (fn) fn(el.dataset, el); return; }
  if (e.target.id === 'sheet' && Date.now() - sheetOpenedAt > 450) closeSheet();
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const fn = forms[form.dataset.form];
  if (fn) fn(new FormData(form), form);
});

document.addEventListener('change', (e) => {
  if (!e.target.matches('.terms-mode')) return;
  const price = e.target.parentElement.querySelector('input[name$=_price]');
  price.hidden = e.target.value !== 'price';
  if (!price.hidden) price.focus();
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('#deck').hidden) closeDeck();
  else if (!$('#picker').hidden) closePicker();
  else if (sheetView) closeSheet();
});

document.addEventListener('visibilitychange', () => { if (document.hidden) stopScan(); else resumeScan(0); });

window.addEventListener('message', (e) => {
  const f = document.querySelector('#deck iframe');
  if (f && e.source === f.contentWindow && e.data && e.data.type === 'deck-close') closeDeck();
});

(function boot() {
  document.body.insertAdjacentHTML('afterbegin', buildWorld());
  mainMap = createMap({ onPin: (key) => actions.place({ key }) });
  const saved = readSaved();
  state = saved.state;
  if (state && Core.isLegacyDemo(saved.raw)) {
    persist();
    setTimeout(() => toast('Tessera now works with real people. The sample people are gone; your flats are kept.'), 400);
  } else if (!state && saved.stale) {
    notice = 'Saved data from an earlier version couldn’t be opened, so you’re starting fresh.';
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  const h = location.hash.slice(1);
  if (TABS.some(([id]) => id === h)) tab = h;
  render();
})();

</script>
