=\"label\" style=\"margin-top:8px\">Honest limits<\/span>\n    <div class=\"limits\">\n      <div><p>A QR code can be relayed, so a meeting is strong evidence, not proof.<\/p><\/div>\n      <div><p>Delivered data cannot be recalled after you remove a contact.<\/p><\/div>\n      <div><p>Losing the device without a backup loses the identity.<\/p><\/div>\n      <div><p>The cryptography is unaudited prototype design. A security review comes first.<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- 14 -->\n<section class=\"slide roomy\" id=\"s14\" data-title=\"Personas\">\n  <div class=\"kicker\"><span><b>14<\/b> — Customer journey<\/span><span>Personas · hypotheses<\/span><\/div>\n  <h2>Four kinds of people, each with a reason to want a place among people they have met.<\/h2>\n  <div class=\"body\">\n    <div class=\"cards c4\">\n      <div class=\"card\"><div><span class=\"label\">Traveller<\/span><h3>The workationer<\/h3><\/div>\n        <div><span class=\"label\">Goal<\/span><p>Stay several weeks somewhere new and meet locals.<\/p><\/div>\n        <div><span class=\"label\">Pain today<\/span><p>Short-stay pricing and no local footing.<\/p><\/div>\n        <div><span class=\"label\">With Tessera<\/span><p>Connections made at events unlock places nearby.<\/p><\/div><\/div>\n      <div class=\"card\"><div><span class=\"label\">Supply<\/span><h3>The host<\/h3><\/div>\n        <div><span class=\"label\">Goal<\/span><p>Let a spare room be used by people I can trust.<\/p><\/div>\n        <div><span class=\"label\">Pain today<\/span><p>Public listings mean strangers and constant admin.<\/p><\/div>\n        <div><span class=\"label\">With Tessera<\/span><p>Only people I met see it, on terms I set per circle.<\/p><\/div><\/div>\n      <div class=\"card\"><div><span class=\"label\">Transition<\/span><h3>The relocator<\/h3><\/div>\n        <div><span class=\"label\">Goal<\/span><p>Bridge the weeks between two homes.<\/p><\/div>\n        <div><span class=\"label\">Pain today<\/span><p>Hotels are costly for weeks and asking friends is awkward.<\/p><\/div>\n        <div><span class=\"label\">With Tessera<\/span><p>A ready list of places from people I have met.<\/p><\/div><\/div>\n      <div class=\"card\"><div><span class=\"label\">Later<\/span><h3>The lender<\/h3><\/div>\n        <div><span class=\"label\">Goal<\/span><p>Lend a drill or a car to neighbours without a platform.<\/p><\/div>\n        <div><span class=\"label\">Pain today<\/span><p>Lending to near-strangers feels risky.<\/p><\/div>\n        <div><span class=\"label\">With Tessera<\/span><p>The same circles and terms for tools and vehicles.<\/p><\/div><\/div>\n    <\/div>\n    <p class=\"note\">These are hypotheses. Each one needs interviews before it counts as a segment.<\/p>\n  <\/div>\n<\/section>\n\n<\!-- 15 -->\n<section class=\"slide dense\" id=\"s15\" data-title=\"Customer journey\">\n  <div class=\"kicker\"><span><b>15<\/b> — Customer journey<\/span><span>First meeting to return stay<\/span><\/div>\n  <h2>The journey starts with a scan and ends with the next stay.<\/h2>\n  <svg class=\"curve\" viewBox=\"0 0 1152 64\" preserveAspectRatio=\"none\" aria-label=\"Illustrative feeling curve across the five stages\">\n    <line x1=\"0\" y1=\"32\" x2=\"1152\" y2=\"32\" stroke=\"#e3e6ea\" stroke-dasharray=\"4 5\"/>\n    <polyline points=\"115,44 345,22 576,40 806,12 1037,20\" fill=\"none\" stroke=\"#3b64ad\" stroke-width=\"2\"/>\n    <g fill=\"#fff\" stroke=\"#3b64ad\" stroke-width=\"2\"><circle cx=\"115\" cy=\"44\" r=\"5\"/><circle cx=\"345\" cy=\"22\" r=\"5\"/><circle cx=\"576\" cy=\"40\" r=\"5\"/><circle cx=\"806\" cy=\"12\" r=\"5\"/><circle cx=\"1037\" cy=\"20\" r=\"5\"/><\/g>\n  <\/svg>\n  <div class=\"jgrid\">\n    <div class=\"stage-col\"><h3><span>1<\/span>Meet<\/h3>\n      <div><span class=\"label\">Does<\/span><p>Scans a QR at a party or a coworking space.<\/p><\/div>\n      <div class=\"on\"><span class=\"label\">Moment of truth<\/span><p>The scan feels quick and safe.<\/p><\/div>\n      <div><span class=\"label\">Pain to gain<\/span><p>From swapping numbers awkwardly to one scan.<\/p><\/div>\n      <div><span class=\"label\">Tessera<\/span><p>Two-scan handshake.<\/p><\/div><\/div>\n    <div class=\"stage-col\"><h3><span>2<\/span>Connect<\/h3>\n      <div><span class=\"label\">Does<\/span><p>Picks a circle, adds a note, sends their flats.<\/p><\/div>\n      <div class=\"on\"><span class=\"label\">Moment of truth<\/span><p>I stay in control of what they see.<\/p><\/div>\n      <div><span class=\"label\">Pain to gain<\/span><p>From posting publicly to sharing privately.<\/p><\/div>\n      <div><span class=\"label\">Tessera<\/span><p>Circles and sealed bundles.<\/p><\/div><\/div>\n    <div class=\"stage-col\"><h3><span>3<\/span>Ask<\/h3>\n      <div><span class=\"label\">Does<\/span><p>Finds a place on the map and requests dates.<\/p><\/div>\n      <div class=\"on\"><span class=\"label\">Moment of truth<\/span><p>The host answers clearly.<\/p><\/div>\n      <div><span class=\"label\">Pain to gain<\/span><p>From haggling to visible terms.<\/p><\/div>\n      <div><span class=\"label\">Tessera<\/span><p>Map, terms and requests.<\/p><\/div><\/div>\n    <div class=\"stage-col\"><h3><span>4<\/span>Stay<\/h3>\n      <div><span class=\"label\">Does<\/span><p>Receives arrival notes and stays.<\/p><\/div>\n      <div class=\"on\"><span class=\"label\">Moment of truth<\/span><p>Arrival is smooth.<\/p><\/div>\n      <div><span class=\"label\">Pain to gain<\/span><p>From uncertainty to clear instructions.<\/p><\/div>\n      <div><span class=\"label\">Tessera<\/span><p>Private notes, released on accept.<\/p><\/div><\/div>\n    <div class=\"stage-col\"><h3><span>5<\/span>Return<\/h3>\n      <div><span class=\"label\">Does<\/span><p>Books again and introduces a friend.<\/p><\/div>\n      <div class=\"on\"><span class=\"label\">Moment of truth<\/span><p>Inviting someone feels good.<\/p><\/div>\n      <div><span class=\"label\">Pain to gain<\/span><p>From one stay to a network.<\/p><\/div>\n      <div><span class=\"label\">Tessera<\/span><p>Return stays and introductions.<\/p><\/div><\/div>\n  <\/div>\n  <p class=\"note\" style=\"margin-top:8px\">The curve is illustrative, drawn from our hypotheses, not from measured data.<\/p>\n<\/section>\n\n<\!-- 16 -->\n<section class=\"slide\" id=\"s16\" data-title=\"Market and timing\">\n  <div class=\"kicker\"><span><b>16<\/b> — Market and timing<\/span><span>Bottom-up, assumptions only<\/span><\/div>\n  <h2>Start small and count from the bottom: every number below is an assumption to validate.<\/h2>\n  <div class=\"body\">\n    <div>\n      <span class=\"label\">Supply: places that could be listed<\/span>\n      <div class=\"chain\" style=\"margin-top:6px\">\n        <div class=\"box\"><p>A1 · seed communities<\/p><div class=\"big\">10<\/div><p class=\"mute\">to start · to validate<\/p><\/div><div class=\"op\">×<\/div>\n        <div class=\"box\"><p>A2 · members each<\/p><div class=\"big\">300<\/div><p class=\"mute\">to validate<\/p><\/div><div class=\"op\">×<\/div>\n        <div class=\"box\"><p>A3 · would list a spare room<\/p><div class=\"big\">15%<\/div><p class=\"mute\">to validate<\/p><\/div><div class=\"op\">=<\/div>\n        <div class=\"box out\"><p>Listed places<\/p><div class=\"big\">450<\/div><p class=\"mute\">illustrative<\/p><\/div>\n      <\/div>\n    <\/div>\n    <div>\n      <span class=\"label\">Demand: connections that could turn into stays<\/span>\n      <div class=\"chain\" style=\"margin-top:6px\">\n        <div class=\"box\"><p>Members<\/p><div class=\"big\">3,000<\/div><p class=\"mute\">from A1 × A2<\/p><\/div><div class=\"op\">×<\/div>\n        <div class=\"box\"><p>A4 · meetings per member a year<\/p><div class=\"big\">6<\/div><p class=\"mute\">to validate<\/p><\/div><div class=\"op\">×<\/div>\n        <div class=\"box\"><p>A5 · connections that lead to a stay<\/p><div class=\"big\">5%<\/div><p class=\"mute\">to validate<\/p><\/div><div class=\"op\">=<\/div>\n        <div class=\"box out\"><p>Stays a year<\/p><div class=\"big\">900<\/div><p class=\"mute\">illustrative<\/p><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"split\" style=\"margin-top:2px\">\n      <ul class=\"pts\">\n        <li><p>Not a forecast. Each assumption is replaced with measured data from the first pilot.<\/p><\/li>\n        <li><p>The wider market is sized only after pilots show real meeting and stay rates. <span class=\"ph\">[market size: to research]<\/span><\/p><\/li>\n      <\/ul>\n      <div class=\"box\"><span class=\"label\">Why now (hypotheses)<\/span>\n        <ul style=\"list-style:none;margin-top:6px\"><li>Browsers can now do keys, camera and offline storage without an app store.<\/li><li>More people can work from more places. To validate for our segments.<\/li><\/ul><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- 17 -->\n<section class=\"slide dense\" id=\"s17\" data-title=\"Landscape\">\n  <div class=\"kicker\"><span><b>17<\/b> — Landscape<\/span><span>By category<\/span><\/div>\n  <h2>Existing options sit in categories; Tessera is the private, in-person layer beneath them.<\/h2>\n  <div class=\"body\">\n    <div class=\"tbl\" style=\"--c:150px 1fr 1fr 1.25fr\">\n      <div class=\"r h\"><div>Category<\/div><div>Where trust typically comes from<\/div><div>Where listings typically live<\/div><div>How Tessera differs<\/div><\/div>\n      <div class=\"r\"><div data-h=\"Category\">Marketplaces<\/div><div data-h=\"Where trust typically comes from\">Reviews, platform guarantees, deposits<\/div><div data-h=\"Where listings typically live\">Public, on the platform<\/div><div data-h=\"How Tessera differs\">Trust comes from a meeting; listings are private and local<\/div><\/div>\n      <div class=\"r\"><div data-h=\"Category\">Home exchange<\/div><div data-h=\"Where trust typically comes from\">Membership and reciprocity<\/div><div data-h=\"Where listings typically live\">Member directories<\/div><div data-h=\"How Tessera differs\">No matching swap needed; terms per circle<\/div><\/div>\n      <div class=\"r\"><div data-h=\"Category\">Hospitality networks<\/div><div data-h=\"Where trust typically comes from\">Shared values, profiles and references<\/div><div data-h=\"Where listings typically live\">Member profiles on the network<\/div><div data-h=\"How Tessera differs\">A real meeting instead of a profile; no central profile<\/div><\/div>\n      <div class=\"r\"><div data-h=\"Category\">Tool libraries<\/div><div data-h=\"Where trust typically comes from\">A local organisation and its rules<\/div><div data-h=\"Where listings typically live\">The organisation's catalogue<\/div><div data-h=\"How Tessera differs\">Peer to peer inside your circles, with no staffed counter<\/div><\/div>\n      <div class=\"r hl\"><div data-h=\"Category\">Tessera<\/div><div data-h=\"Where trust typically comes from\">A meeting in person<\/div><div data-h=\"Where listings typically live\">On the owner's device<\/div><div data-h=\"How Tessera differs\">Works beside the others, not instead of them<\/div><\/div>\n    <\/div>\n    <p class=\"note\">Compared by category and by typical behaviour. A named competitor review is still to do.<\/p>\n  <\/div>\n<\/section>\n\n<\!-- 18 -->\n<section class=\"slide dense\" id=\"s18\" data-title=\"Business model\">\n  <div class=\"kicker\"><span><b>18<\/b> — Business model<\/span><span>Options to test<\/span><\/div>\n  <h2>Core sharing stays free and local. Money comes from convenience, not from your data.<\/h2>\n  <div class=\"body\">\n    <div class=\"tbl\" style=\"--c:1.3fr 1.5fr 1.2fr 1.3fr\">\n      <div class=\"r h\"><div>Option<\/div><div>Who pays<\/div><div>When<\/div><div>Status<\/div><\/div>\n      <div class=\"r\"><div data-h=\"Option\">Relay and backup subscription<\/div><div data-h=\"Who pays\">People who want offline delivery and several devices<\/div><div data-h=\"When\">After the real handshake ships<\/div><div data-h=\"Status\">To test<\/div><\/div>\n      <div class=\"r\"><div data-h=\"Option\">Fee on settled stays<\/div><div data-h=\"Who pays\">Guests or hosts, through optional settlement<\/div><div data-h=\"When\">After a settlement layer exists<\/div><div data-h=\"Status\">To test, needs legal review<\/div><\/div>\n      <div class=\"r\"><div data-h=\"Option\">Community licences<\/div><div data-h=\"Who pays\">Coworking, coliving, alumni networks, festivals<\/div><div data-h=\"When\">Once pilots exist<\/div><div data-h=\"Status\">To test<\/div><\/div>\n      <div class=\"r\"><div data-h=\"Option\">Partner referrals<\/div><div data-h=\"Who pays\">Insurers and relocation services<\/div><div data-h=\"When\">Later<\/div><div data-h=\"Status\">To test, must not weaken trust<\/div><\/div>\n      <div class=\"r\"><div data-h=\"Option\">Grants and sponsorship<\/div><div data-h=\"Who pays\">Public-interest and open-source funders<\/div><div data-h=\"When\">From the start<\/div><div data-h=\"Status\">Open<\/div><\/div>\n    <\/div>\n    <div class=\"callout\"><p><b>Principles:<\/b> no ads, and no selling of data, because we never hold it. Prices: <span class=\"ph\">[to decide]<\/span><\/p><\/div>\n  <\/div>\n<\/section>\n\n<\!-- 19 -->\n<section class=\"slide roomy\" id=\"s19\" data-title=\"Go-to-market\">\n  <div class=\"kicker\"><span><b>19<\/b> — Go-to-market<\/span><span>Cold start<\/span><\/div>\n  <h2>Win one community first: density beats spread.<\/h2>\n  <div class=\"body\">\n    <div class=\"split\">\n      <ul class=\"pts\">\n        <li><p>Start inside one community, such as a coworking space or a remote-work meetup, where people already meet often.<\/p><\/li>\n        <li><p>Every meeting is the growth loop: a scan invites the other person in.<\/p><\/li>\n        <li><p>Give hosts a reason to list first: a map that fills as their contacts join.<\/p><\/li>\n        <li><p>Expand along overlapping travel routes, one corridor at a time.<\/p><\/li>\n      <\/ul>\n      <div style=\"display:grid;gap:14px;align-content:start\">\n        <div class=\"box tint\"><span class=\"label\">First pilot goal<\/span><p style=\"margin-top:6px\"><span class=\"ph\">[N]<\/span> communities, <span class=\"ph\">[N]<\/span> real meetings, <span class=\"ph\">[N]<\/span> listed places. Numbers to decide.<\/p><\/div>\n        <div class=\"box\"><span class=\"label\">First metrics<\/span>\n          <ul style=\"list-style:none;margin-top:6px\"><li>Time from install to first meeting<\/li><li>Share of users with a listed place<\/li><li>Requests per listed place<\/li><\/ul><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- 20 -->\n<section class=\"slide roomy\" id=\"s20\" data-title=\"Roadmap\">\n  <div class=\"kicker\"><span><b>20<\/b> — Roadmap<\/span><span>Five phases, no dates yet<\/span><\/div>\n  <h2>From simulated demo to real handshake to shared resources.<\/h2>\n  <div class=\"road\">\n    <div class=\"phase done\"><span class=\"chip blue\">Done<\/span><h3>0 · Prototype<\/h3><p>Simulated network, map, terms per circle, this deck.<\/p><div class=\"exit\"><span class=\"label\">Done when<\/span><p>Shown to real people, feedback collected.<\/p><\/div><\/div>\n    <div class=\"phase next\"><span class=\"chip blue\">Next<\/span><h3>1 · Real handshake<\/h3><p>Keypairs, two-scan meeting, sealed bundles, requests and responses by QR, link or paste. Backup and restore.<\/p><div class=\"exit\"><span class=\"label\">Done when<\/span><p>Two real phones complete a stay request end to end.<\/p><\/div><\/div>\n    <div class=\"phase\"><span class=\"chip\">Later<\/span><h3>2 · Sync and relay<\/h3><p>Optional mailbox, several devices, bundle updates.<\/p><div class=\"exit\"><span class=\"label\">Done when<\/span><p>An update reaches a contact without a new scan.<\/p><\/div><\/div>\n    <div class=\"phase\"><span class=\"chip\">Later<\/span><h3>3 · Beyond flats<\/h3><p>Tools and vehicles as adapters, photos, availability calendars.<\/p><div class=\"exit\"><span class=\"label\">Done when<\/span><p>One non-flat asset is shared in a pilot.<\/p><\/div><\/div>\n    <div class=\"phase\"><span class=\"chip\">Later<\/span><h3>4 · Settlement<\/h3><p>Optional payments and deposits, reputation from signed stays, insurance partners.<\/p><div class=\"exit\"><span class=\"label\">Done when<\/span><p>A paid stay settles end to end.<\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<\!-- 21 -->\n<section class=\"slide dense\" id=\"s21\" data-title=\"Risks\">\n  <div class=\"kicker\"><span><b>21<\/b> — Risks<\/span><span>And what we do about them<\/span><\/div>\n  <h2>The main risks are human and legal before they are technical.<\/h2>\n  <div class=\"body\">\n    <div class=\"tbl\" style=\"--c:1.2fr 1.4fr 2fr\">\n      <div class=\"r h\"><div>Risk<\/div><div>Why it matters<\/div><div>Mitigation<\/div><\/div>\n      <div class=\"r\"><div data-h=\"Risk\">Safety and liability<\/div><div data-h=\"Why it matters\">A stay goes wrong<\/div><div data-h=\"Mitigation\">Terms per circle, clear norms, host controls, legal review. Guidance, not guarantees.<\/div><\/div>\n      <div class=\"r\"><div data-h=\"Risk\">Insurance and local letting rules<\/div><div data-h=\"Why it matters\">Hosts may be exposed, and rules vary by city<\/div><div data-h=\"Mitigation\">Research per launch city, explicit host responsibility notice, insurer partners later.<\/div><\/div>\n      <div class=\"r\"><div data-h=\"Risk\">Relayed or fake meetings<\/div><div data-h=\"Why it matters\">QR codes can be photographed and forwarded<\/div><div data-h=\"Mitigation\">Short lifetimes, single use, both sides confirm. Treated as evidence, not proof.<\/div><\/div>\n      <div class=\"r\"><div data-h=\"Risk\">Lost phone or cleared browser<\/div><div data-h=\"Why it matters\">The identity is lost without a backup<\/div><div data-h=\"Mitigation\">Backup prompts, a restore flow, several devices later.<\/div><\/div>\n      <div class=\"r\"><div data-h=\"Risk\">Removed contacts keep old data<\/div><div data-h=\"Why it matters\">Delivered bundles cannot be recalled<\/div><div data-h=\"Mitigation\">Say so plainly, share less by default, short-lived bundles later.<\/div><\/div>\n      <div class=\"r\"><div data-h=\"Risk\">Cold start<\/div><div data-h=\"Why it matters\">An empty map is not useful<\/div><div data-h=\"Mitigation\">Community-first density and seeded pilots.<\/div><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- 22 -->\n<section class=\"slide dense\" id=\"s22\" data-title=\"Team and roles\">\n  <div class=\"kicker\"><span><b>22<\/b> — Team and roles<\/span><span>For developers<\/span><\/div>\n  <h2>A small open team, with room for people who want to build local-first software.<\/h2>\n  <div class=\"body\">\n    <div class=\"split\">\n      <div class=\"roles\">\n        <div class=\"r\"><div><b>Founder and product lead<\/b><p><span class=\"ph\">[name to fill in]<\/span><\/p><\/div><span class=\"chip blue\">Lead<\/span><\/div>\n        <div class=\"r\"><div><b>Full-stack engineer<\/b><p>PWA, local-first storage, sync<\/p><\/div><span class=\"chip\">Open<\/span><\/div>\n        <div class=\"r\"><div><b>Security and cryptography engineer<\/b><p>Protocol and threat-model review<\/p><\/div><span class=\"chip\">Open<\/span><\/div>\n        <div class=\"r\"><div><b>Product designer<\/b><p>Visual system and accessibility<\/p><\/div><span class=\"chip\">Open<\/span><\/div>\n        <div class=\"r\"><div><b>Community lead<\/b><p>Pilots, events, host onboarding<\/p><\/div><span class=\"chip\">Open<\/span><\/div>\n      <\/div>\n      <div style=\"display:grid;gap:14px;align-content:start\">\n        <div class=\"box\"><span class=\"label\">Stack today<\/span><p style=\"margin-top:6px\">Vanilla JavaScript in one HTML file, offline vector map with an equal-area projection, tests in Node and a browser walk-through.<\/p><\/div>\n        <div class=\"box\"><span class=\"label\">Planned<\/span><p style=\"margin-top:6px\">WebCrypto (ECDSA and ECDH on P-256, HKDF, AES-GCM), IndexedDB, a service worker, a CRDT library, and an optional stateless relay.<\/p><\/div>\n        <div class=\"box tint\"><span class=\"label\">How to contribute<\/span><p style=\"margin-top:6px\">Repository: <span class=\"ph\">[URL to publish]<\/span>. Good first work: protocol tests, threat-model review, the resource adapter interface, accessibility, translations.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- 23 -->\n<section class=\"slide dense roomy\" id=\"s23\" data-title=\"The ask\">\n  <div class=\"kicker\"><span><b>23<\/b> — The ask<\/span><span>Funding and builders<\/span><\/div>\n  <h2>We are looking for funding to build the real thing, and for people to build it with.<\/h2>\n  <div class=\"body\">\n    <div class=\"cards c3\">\n      <div class=\"tier\"><span class=\"label\">Tier A<\/span><h3>Real handshake<\/h3><div class=\"amt\"><span class=\"ph\">€ — to decide<\/span><\/div><p>Keypair identity, two-scan meeting, sealed messages, backup, and a security review.<\/p><\/div>\n      <div class=\"tier\"><span class=\"label\">Tier B<\/span><h3>Pilots in three communities<\/h3><div class=\"amt\"><span class=\"ph\">€ — to decide<\/span><\/div><p>Relay, sync, on-the-ground pilots and measurement.<\/p><\/div>\n      <div class=\"tier\"><span class=\"label\">Tier C<\/span><h3>Beyond flats, and settlement<\/h3><div class=\"amt\"><span class=\"ph\">€ — to decide<\/span><\/div><p>Tool and vehicle adapters, optional settlement, legal and insurance work.<\/p><\/div>\n    <\/div>\n    <span class=\"label\">Use of funds<\/span>\n    <div class=\"funds\">\n      <div>Engineering<span class=\"ph\">[ % ]<\/span><\/div><div>Security review<span class=\"ph\">[ % ]<\/span><\/div><div>Community pilots<span class=\"ph\">[ % ]<\/span><\/div><div>Legal and insurance<span class=\"ph\">[ % ]<\/span><\/div><div>Design<span class=\"ph\">[ % ]<\/span><\/div>\n    <\/div>\n    <div class=\"callout\"><p><b>Want to build it?<\/b> Local-first, open protocol, real users at real meetings. Say hello: <span class=\"ph\">[name]<\/span> · <span class=\"ph\">[email]<\/span> · <span class=\"ph\">[repository URL]<\/span><\/p><\/div>\n  <\/div>\n<\/section>\n\n<\!-- 24 -->\n<section class=\"slide dense\" id=\"s24\" data-title=\"Appendix\">\n  <div class=\"kicker\"><span><b>24<\/b> — Appendix<\/span><span>Glossary and metrics<\/span><\/div>\n  <h2>Glossary, and the metrics we propose to track.<\/h2>\n  <div class=\"body\">\n    <div class=\"split\">\n      <div>\n        <span class=\"label\">Glossary<\/span>\n        <dl class=\"gloss\" style=\"margin-top:8px\">\n          <dt>Tessera<\/dt><dd>Roman token split between two hosts as proof of a guest-friendship. Our working title.<\/dd>\n          <dt>Circle<\/dt><dd>Family, Friends or Met. Private, and set per contact.<\/dd>\n          <dt>Offer, accept<\/dt><dd>The two signed QR messages of the meeting handshake.<\/dd>\n          <dt>Bundle<\/dt><dd>The flats one contact may see, sealed to them.<\/dd>\n          <dt>Local-first<\/dt><dd>Data lives on the user's device; servers are optional.<\/dd>\n          <dt>Equal-area map<\/dt><dd>A projection that keeps regions at true relative size.<\/dd>\n        <\/dl>\n      <\/div>\n      <div>\n        <span class=\"label\">Proposed metrics<\/span>\n        <ul class=\"pts\" style=\"margin-top:10px;gap:9px\">\n          <li><p>Time from install to first meeting<\/p><\/li>\n          <li><p>Meetings per user per month<\/p><\/li>\n          <li><p>Share of users with a listed place<\/p><\/li>\n          <li><p>Requests per listed place, and share accepted<\/p><\/li>\n          <li><p>Return stays among the same contacts<\/p><\/li>\n          <li><p>Share of users who export a backup<\/p><\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\/div><\/div>\n<button id=\"zprev\" tabindex=\"-1\" aria-label=\"Previous slide\"><\/button>\n<button id=\"znext\" tabindex=\"-1\" aria-label=\"Next slide\"><\/button>\n<div id=\"chrome\"><button id=\"btn-grid\" type=\"button\">Grid<\/button><button id=\"btn-close\" type=\"button\" hidden>Close<\/button><span id=\"counter\">01 / 24<\/span><\/div>\n<div id=\"overview\" hidden><\/div>\n\n<script>\n(function () {\n  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));\n  var N = slides.length;\n  var stage = document.getElementById('stage');\n  var counter = document.getElementById('counter');\n  var bar = document.querySelector('#progress i');\n  var overview = document.getElementById('overview');\n  var btnClose = document.getElementById('btn-close');\n  var narrow = window.matchMedia('(max-width:720px)');\n  var embedded = window.parent !== window;\n  var cur = 0;\n  var ovOpen = false;\n\n  function pad(n) { return (n < 10 ? '0' : '') + n; }\n  function fit() {\n    if (narrow.matches) { stage.style.transform = ''; return; }\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n  function paint() {\n    slides.forEach(function (s, k) { s.classList.toggle('active', k === cur); });\n    counter.textContent = pad(cur + 1) + ' / ' + pad(N);\n    bar.style.width = ((cur + 1) / N * 100) + '%';\n    try { history.replaceState(null, '', '#' + slides[cur].id); } catch (e) {}\n  }\n  function show(i) {\n    cur = Math.max(0, Math.min(N - 1, i));\n    paint();\n    if (narrow.matches) slides[cur].scrollIntoView({ block: 'start' });\n  }\n  function next() { show(cur + 1); }\n  function prev() { show(cur - 1); }\n\n  function buildOverview() {\n    overview.innerHTML = '<div class=\"ov-grid\">' + slides.map(function (s, k) {\n      return '<button class=\"ov-item' + (k === cur ? ' cur' : '') + '\" data-i=\"' + k + '\"><span>' + pad(k + 1) + '<\/span><b>' + s.getAttribute('data-title') + '<\/b><\/button>';\n    }).join('') + '<\/div>';\n  }\n  function toggleOverview(force) {\n    ovOpen = typeof force === 'boolean' ? force : !ovOpen;\n    if (ovOpen) buildOverview();\n    overview.hidden = !ovOpen;\n  }\n  overview.addEventListener('click', function (e) {\n    var b = e.target.closest('.ov-item');\n    if (!b) return;\n    toggleOverview(false);\n    show(parseInt(b.getAttribute('data-i'), 10));\n  });\n\n  document.getElementById('zprev').addEventListener('click', prev);\n  document.getElementById('znext').addEventListener('click', next);\n  document.getElementById('btn-grid').addEventListener('click', function () { toggleOverview(); });\n  btnClose.hidden = !embedded;\n  btnClose.addEventListener('click', function () { parent.postMessage({ type: 'deck-close' }, '*'); });\n\n  document.addEventListener('keydown', function (e) {\n    if (e.metaKey || e.ctrlKey || e.altKey) return;\n    var k = e.key;\n    if (k === 'g' || k === 'G') { toggleOverview(); e.preventDefault(); return; }\n    if (k === 'Escape') {\n      if (ovOpen) toggleOverview(false);\n      else if (embedded) parent.postMessage({ type: 'deck-close' }, '*');\n      return;\n    }\n    if (ovOpen) return;\n    if (k === 'ArrowRight') { next(); e.preventDefault(); }\n    else if (k === 'ArrowLeft') { prev(); e.preventDefault(); }\n    else if (k === 'Home') { show(0); e.preventDefault(); }\n    else if (k === 'End') { show(N - 1); e.preventDefault(); }\n    else if (!narrow.matches) {\n      if (k === 'ArrowDown' || k === 'PageDown' || k === ' ') { next(); e.preventDefault(); }\n      else if (k === 'ArrowUp' || k === 'PageUp') { prev(); e.preventDefault(); }\n    }\n  });\n\n  var tx = 0, ty = 0;\n  stage.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });\n  stage.addEventListener('touchend', function (e) {\n    if (narrow.matches || ovOpen) return;\n    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;\n    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { if (dx < 0) next(); else prev(); }\n  }, { passive: true });\n\n  function trackScroll() {\n    if (!narrow.matches || ovOpen) return;\n    var y = window.innerHeight * 0.45, idx = cur;\n    for (var i = 0; i < N; i++) {\n      var r = slides[i].getBoundingClientRect();\n      if (r.top <= y && r.bottom > y) { idx = i; break; }\n    }\n    if (idx !== cur) { cur = idx; paint(); }\n  }\n  window.addEventListener('scroll', trackScroll, { passive: true });\n\n  function fromHash() {\n    var id = location.hash.slice(1);\n    for (var i = 0; i < N; i++) if (slides[i].id === id) return i;\n    return 0;\n  }\n  window.addEventListener('hashchange', function () { var i = fromHash(); if (i !== cur) show(i); });\n  window.addEventListener('resize', function () { fit(); if (narrow.matches) slides[cur].scrollIntoView({ block: 'start' }); });\n\n  fit();\n  cur = fromHash();\n  paint();\n  if (narrow.matches && cur > 0) slides[cur].scrollIntoView({ block: 'start' });\n  try { document.body.focus(); window.focus(); } catch (e) {}\n  window.addEventListener('message', function (e) { if (e.data && e.data.type === 'deck-focus') { try { window.focus(); } catch (x) {} } });\n})();\n<\/script>\n<\/body>\n<\/html>\n";</script>

<script id="ui">
// Captured before anything renders: the app as shipped, used to build backup files.
const PRISTINE = (() => {
  const c = document.documentElement.cloneNode(true);
  c.querySelectorAll('script:not([id])').forEach((n) => n.remove());
  return '<!DOCTYPE html>\n' + c.outerHTML;
})();

const { esc, CIRCLES, CIRCLE_LABEL: LABEL } = Core;
const $ = (s) => document.querySelector(s);
const STORAGE_KEY = 'tessera.demo.v1'; // never change: a new key means everyone starts empty
const QR_MAX = 1800;
const TABS = [['map', 'Map'], ['stays', 'Stays'], ['flats', 'Flats'], ['people', 'People'], ['you', 'You']];
const TITLES = { map: 'Map', stays: 'Stays', flats: 'Your flats', people: 'People', you: 'You', guide: 'How it works' };
const ICONS = {
  map: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3 3.2 15 0 18M12 3c-3.2 3-3.2 15 0 18"/>',
  stays: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  flats: '<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>',
  people: '<circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/>',
  you: '<path d="M4 8h16M4 16h16"/><circle cx="9" cy="8" r="2"/><circle cx="15" cy="16" r="2"/>',
};
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const firstName = (name) => String(name || '').split(' ')[0];
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const pad2 = (n) => String(n).padStart(2, '0');
const contactOf = (id) => Core.contactOf(state, id);

let state = null;
let tab = 'map';
let sheetView = null;
let meet = null;
let outbox = null;
let notice = '';
let opener = null;
let toastTimer = 0;
let sheetOpenedAt = 0;
let lastPlaceSig = '';
let mapFilter = 'all';
let mapNeedsFit = true;
let mainMap = null;
let pickerMap = null;
let pickerState = null;
let scanner = null;

/* ---------- storage ---------- */

function parseJson(text) { try { return JSON.parse(text); } catch { return undefined; } }

function readSaved() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch {}
  const local = raw ? parseJson(raw) : null;
  const el = document.getElementById('saved-data');
  const embedded = el ? parseJson(el.textContent.trim() || 'null') : null;
  const a = Core.normalize(local);
  const b = Core.normalize(embedded);
  let pick = a, src = local;
  if (b && (!a || b.updatedAt > a.updatedAt)) { pick = b; src = embedded; }
  return { state: pick, raw: src, stale: !!raw && !a && !b };
}

function persist() {
  state.updatedAt = Date.now();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch { toast('Couldn’t save. Storage may be full or blocked.'); }
}

function commit(next) { state = next; persist(); render(); }

/* ---------- small helpers ---------- */

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 3200);
}

function formError(form, msg) {
  const el = form.querySelector('.error');
  if (!el) return toast(msg);
  el.textContent = msg;
  el.hidden = false;
}

function metLine(c) {
  return `<span class="met">Met</span> ${Core.formatDay(c.metAt)}${c.note ? ' · ' + esc(c.note) : ''}`;
}

function pips(rooms, beds) {
  const sq = (n, cls) => Array.from({ length: Math.min(n, 8) }, () => `<i class="${cls}"></i>`).join('') + (n > 8 ? ' +' + (n - 8) : '');
  return `<div class="pips"><span>Rooms ${sq(rooms, '')}</span><span>Beds ${sq(beds, 'h')}</span></div>`;
}

function qrSvg(text, label) {
  const q = qrcode(0, 'L');
  q.addData(text);
  q.make();
  const n = q.getModuleCount();
  const quiet = 4;
  const size = n + quiet * 2;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + quiet} ${r + quiet}h1v1h-1z`;
  return `<svg class="qr" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" role="img" aria-label="${esc(label || 'QR code')}"><rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

function isNative() {
  try { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); } catch { return false; }
}

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; }
  } catch {}
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  ta.remove();
  return ok;
}

// Returns 'shared', 'cancelled' or 'copied'/'failed' when sharing isn't available.
async function shareText(text, title) {
  try {
    const P = window.Capacitor && window.Capacitor.Plugins;
    if (isNative() && P && P.Share) { await P.Share.share({ title, text, dialogTitle: title }); return 'shared'; }
    if (navigator.share) { await navigator.share({ title, text }); return 'shared'; }
  } catch (e) {
    const m = String((e && (e.name + ' ' + e.message)) || '');
    if (/abort|cancel/i.test(m)) return 'cancelled';
  }
  return (await copyText(text)) ? 'copied' : 'failed';
}

/* ---------- camera scanning ---------- */

function stopScan() {
  if (!scanner) return;
  clearTimeout(scanner.timer);
  scanner.stopped = true;
  if (scanner.stream) scanner.stream.getTracks().forEach((t) => t.stop());
  scanner = null;
}

function scanStatus(msg) { const el = $('#scan-status'); if (el) el.textContent = msg; }

async function startScan(onCode) {
  stopScan();
  const video = $('#scan-video');
  if (!video) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    scanStatus('No camera available here. Paste the code instead.');
    return;
  }
  const me = { stopped: false, timer: 0, stream: null };
  scanner = me;
  try {
    me.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  } catch {
    if (scanner === me) scanner = null;
    scanStatus('The camera is blocked. Allow it in your settings, or paste the code instead.');
    return;
  }
  if (me.stopped) { me.stream.getTracks().forEach((t) => t.stop()); return; }
  video.srcObject = me.stream;
  video.setAttribute('playsinline', '');
  video.muted = true;
  try { await video.play(); } catch {}
  scanStatus('Point the camera at their code.');
  let detector = null;
  try { if ('BarcodeDetector' in window) detector = new window.BarcodeDetector({ formats: ['qr_code'] }); } catch {}
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const tick = async () => {
    if (me.stopped) return;
    let found = '';
    try {
      if (video.readyState >= 2 && video.videoWidth) {
        if (detector) {
          const codes = await detector.detect(video);
          const hit = codes.find((c) => /TSR1\./.test(c.rawValue || ''));
          if (hit) found = hit.rawValue;
        } else if (window.jsQR) {
          const s = Math.min(1, 720 / Math.max(video.videoWidth, video.videoHeight));
          canvas.width = Math.round(video.videoWidth * s);
          canvas.height = Math.round(video.videoHeight * s);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const res = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
          if (res && /TSR1\./.test(res.data)) found = res.data;
        }
      }
    } catch { detector = null; }
    if (me.stopped) return;
    if (found) { stopScan(); onCode(found); return; }
    me.timer = setTimeout(tick, 220);
  };
  tick();
}

function scanBox(pasteAct) {
  return `<div class="scanbox"><video id="scan-video" playsinline muted aria-label="Camera"></video></div>
    <p class="meta center" id="scan-status" role="status">Starting the camera…</p>
    <form data-form="paste" data-mode="${pasteAct}" novalidate>
      <label>Or paste a code<textarea name="code" rows="2" placeholder="TSR1.…" autocomplete="off" spellcheck="false"></textarea></label>
      <p class="error" role="alert" hidden></p>
      <button class="btn block">Open code</button>
    </form>`;
}

/* ---------- world and map ---------- */

const MAPU = { XMAX: 2707, YMAX: 1318, KMAX: 12 };

function project(lat, lon) {
  const p = Core.equalEarth(lat, lon);
  return { X: p.x * 1000, Y: -p.y * 1000 };
}

function buildWorld() {
  const topo = JSON.parse(document.getElementById('geo').textContent);
  const [sx, sy] = topo.transform.scale;
  const [tx, ty] = topo.transform.translate;
  const arcs = topo.arcs.map((a) => {
    let x = 0, y = 0;
    return a.map((pt) => { x += pt[0]; y += pt[1]; return [x * sx + tx, y * sy + ty]; });
  });
  const fmt = (lat, lon) => { const p = project(lat, lon); return p.X.toFixed(1) + ' ' + p.Y.toFixed(1); };
  const line = (coords) => {
    let d = '';
    coords.forEach((c, i) => { d += (i === 0 || Math.abs(c[0] - coords[i - 1][0]) > 180 ? 'M' : 'L') + fmt(c[1], c[0]); });
    return d;
  };
  const splitRing = (coords) => {
    const parts = [[coords[0]]];
    for (let i = 1; i < coords.length; i++) {
      const a = coords[i - 1], b = coords[i];
      if (Math.abs(b[0] - a[0]) > 180) {
        const east = a[0] > 0;
        const edge = east ? 180 : -180;
        const den = b[0] + (east ? 360 : -360) - a[0];
        const t = den === 0 ? 0 : (edge - a[0]) / den;
        const lat = a[1] + t * (b[1] - a[1]);
        parts[parts.length - 1].push([edge, lat]);
        parts.push([[-edge, lat], b]);
      } else parts[parts.length - 1].push(b);
    }
    if (parts.length > 1) { const last = parts.pop(); parts[0] = last.concat(parts[0].slice(1)); }
    return parts;
  };
  const arcCoords = (i) => (i < 0 ? arcs[~i].slice().reverse() : arcs[i]);
  const ring = (idxs) => {
    let out = [];
    idxs.forEach((i, n) => { const c = arcCoords(i); out = out.concat(n ? c.slice(1) : c); });
    return out;
  };
  const polys = (g, cb) => {
    if (g.type === 'GeometryCollection') g.geometries.forEach((x) => polys(x, cb));
    else if (g.type === 'Polygon') cb(g.arcs);
    else if (g.type === 'MultiPolygon') g.arcs.forEach(cb);
  };
  let land = '';
  polys(topo.objects.land || topo.objects.countries, (rings) => rings.forEach((r) => splitRing(ring(r)).forEach((part) => { land += line(part) + 'Z'; })));
  const uses = new Array(arcs.length).fill(0);
  polys(topo.objects.countries, (rings) => rings.forEach((r) => r.forEach((i) => { uses[i < 0 ? ~i : i]++; })));
  let borders = '', coast = '';
  arcs.forEach((a, i) => { if (uses[i] > 1) borders += line(a); else coast += line(a); });

  const edge = [];
  for (let la = -90; la <= 90; la += 5) edge.push([la, 180]);
  for (let lo = 180; lo >= -180; lo -= 5) edge.push([90, lo]);
  for (let la = 90; la >= -90; la -= 5) edge.push([la, -180]);
  for (let lo = -180; lo <= 180; lo += 5) edge.push([-90, lo]);
  const outline = 'M' + edge.map((p) => fmt(p[0], p[1])).join('L') + 'Z';
  let grat = '';
  for (let lo = -150; lo <= 150; lo += 30) {
    const pts = [];
    for (let la = -90; la <= 90; la += 5) pts.push(fmt(la, lo));
    grat += 'M' + pts.join('L');
  }
  for (let la = -60; la <= 60; la += 30) grat += `M${fmt(la, -180)}L${fmt(la, 180)}`;

  const nse = 'vector-effect:non-scaling-stroke;fill:none;';
  return `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <path id="w-sphere" d="${outline}" style="fill:#fff"/>
    <path id="w-grat" d="${grat}" style="${nse}stroke:#e3e6ea;stroke-width:1"/>
    <path id="w-land" d="${land}" fill-rule="evenodd" style="fill:var(--land)"/>
    <path id="w-borders" d="${borders}" style="${nse}stroke:#c9ced6;stroke-width:.75"/>
    <path id="w-coast" d="${coast}" style="${nse}stroke:#111318;stroke-width:1"/>
    <path id="w-outline" d="${outline}" style="${nse}stroke:#111318;stroke-width:1.5"/>
  </defs></svg>`;
}

function locator(lat, lon, kind) {
  const { X, Y } = project(lat, lon);
  // About 6 degrees wide: the city and its surroundings, with the coast and borders for orientation.
  const w = 96, h = 60;
  const cx = X.toFixed(1), cy = Y.toFixed(1);
  return `<svg class="locator" viewBox="${(X - w / 2).toFixed(1)} ${(Y - h / 2).toFixed(1)} ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#w-land"/><use href="#w-borders"/><use href="#w-coast"/><circle class="loc-halo ${kind}" cx="${cx}" cy="${cy}" r="9"/><circle class="loc-dot ${kind}" cx="${cx}" cy="${cy}" r="3.4"/></svg>`;
}

function createMap(opts = {}) {
  const el = document.createElement('div');
  el.className = 'map' + (opts.picker ? ' map-picker' : '');
  el.innerHTML = `<svg class="map-svg" role="img" aria-label="World map of places"><g class="world"><use href="#w-sphere"/><use href="#w-grat"/><use href="#w-land"/><use href="#w-borders"/><use href="#w-coast"/><use href="#w-outline"/></g><g class="pins"></g><g class="pick"></g></svg>
    <div class="map-ctl"><button type="button" data-z="in" aria-label="Zoom in">+</button><button type="button" data-z="out" aria-label="Zoom out">−</button></div>
    ${opts.picker ? '' : '<div class="map-btns"><button type="button" data-z="fit">Fit places</button><button type="button" data-z="world">World</button></div>'}`;
  const svg = el.querySelector('svg');
  const world = el.querySelector('.world');
  const pinsG = el.querySelector('.pins');
  const pickG = el.querySelector('.pick');
  let W = 0, H = 0, places = [], picked = null, pendingFit = null;
  const view = { k: 1, cx: 0, cy: 0 };
  const base = () => Math.min(W / (2 * MAPU.XMAX * 1.04), H / (2 * MAPU.YMAX * 1.04));
  const scale = () => base() * view.k;
  const toScreen = (X, Y) => { const s = scale(); return [W / 2 + (X - view.cx) * s, H / 2 + (Y - view.cy) * s]; };
  const toMap = (sx, sy) => { const s = scale(); return [view.cx + (sx - W / 2) / s, view.cy + (sy - H / 2) / s]; };

  function draw() {
    if (!W || !H) return;
    view.k = Math.max(1, Math.min(MAPU.KMAX, view.k));
    view.cx = Math.max(-MAPU.XMAX, Math.min(MAPU.XMAX, view.cx));
    view.cy = Math.max(-MAPU.YMAX, Math.min(MAPU.YMAX, view.cy));
    const s = scale();
    world.setAttribute('transform', `translate(${(W / 2 - view.cx * s).toFixed(2)} ${(H / 2 - view.cy * s).toFixed(2)}) scale(${s})`);
    let html = '';
    places.forEach((p, i) => {
      const { X, Y } = project(p.lat, p.lon);
      const [sx, sy] = toScreen(X, Y);
      if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) return;
      html += `<g class="pin ${p.kind}${p.kind === 'shared' && p.circle ? ' c-' + p.circle : ''}" data-key="${esc(p.key)}" transform="translate(${sx.toFixed(1)} ${sy.toFixed(1)})"><circle class="halo" r="24"/><circle class="dot" r="11"/><text y="4">${i + 1}</text></g>`;
    });
    pinsG.innerHTML = html;
    if (picked) {
      const { X, Y } = project(picked.lat, picked.lon);
      const [sx, sy] = toScreen(X, Y);
      pickG.innerHTML = `<g class="pickpt" transform="translate(${sx.toFixed(1)} ${sy.toFixed(1)})"><circle class="halo" r="26"/><circle class="ring" r="9"/><path class="cross" d="M-17 0H-9M9 0H17M0 -17V-9M0 9V17"/></g>`;
    } else pickG.innerHTML = '';
  }

  function zoomAt(sx, sy, factor) {
    const [X, Y] = toMap(sx, sy);
    view.k = Math.max(1, Math.min(MAPU.KMAX, view.k * factor));
    const s = scale();
    view.cx = X - (sx - W / 2) / s;
    view.cy = Y - (sy - H / 2) / s;
    draw();
  }

  function fit(list) {
    const target = list || places;
    if (!W) { pendingFit = target; return; }
    const box = Core.fitBounds(target);
    if (!box) { view.k = 1; view.cx = 0; view.cy = 0; draw(); return; }
    const X0 = box.minX * 1000, X1 = box.maxX * 1000, Y0 = -box.maxY * 1000, Y1 = -box.minY * 1000;
    view.cx = (X0 + X1) / 2;
    view.cy = (Y0 + Y1) / 2;
    const w = Math.max(X1 - X0, 260), h = Math.max(Y1 - Y0, 180);
    view.k = Math.max(1, Math.min(6, Math.min(W / (w * 1.5 * base()), H / (h * 1.5 * base()))));
    draw();
  }

  function tap(key, clientX, clientY) {
    if (key) { if (opts.onPin) opts.onPin(key); return; }
    if (!opts.onTap) return;
    const r = svg.getBoundingClientRect();
    const [X, Y] = toMap(clientX - r.left, clientY - r.top);
    const ll = Core.equalEarthInverse(X / 1000, -Y / 1000);
    opts.onTap(ll ? { lat: Core.snapCoord(ll.lat), lon: Core.snapCoord(ll.lon) } : null);
  }

  const ptrs = new Map();
  let down = null;
  let lastDist = 0;
  const pair = () => [...ptrs.values()];
  const dist = () => { const [a, b] = pair(); return Math.hypot(a.x - b.x, a.y - b.y); };

  svg.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    svg.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) {
      const pin = e.target.closest ? e.target.closest('[data-key]') : null;
      down = { x: e.clientX, y: e.clientY, t: Date.now(), moved: false, key: pin ? pin.dataset.key : null };
    } else {
      if (down) down.moved = true;
      lastDist = dist();
    }
  });

  svg.addEventListener('pointermove', (e) => {
    const prev = ptrs.get(e.pointerId);
    if (!prev) return;
    const cur = { x: e.clientX, y: e.clientY };
    ptrs.set(e.pointerId, cur);
    if (ptrs.size === 1) {
      if (down && !down.moved && Math.hypot(cur.x - down.x, cur.y - down.y) > 6) down.moved = true;
      if (down && down.moved) {
        const s = scale();
        view.cx -= (cur.x - prev.x) / s;
        view.cy -= (cur.y - prev.y) / s;
        draw();
      }
    } else if (ptrs.size === 2) {
      const d = dist();
      const [a, b] = pair();
      const r = svg.getBoundingClientRect();
      if (lastDist > 0) zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / lastDist);
      lastDist = d;
    }
  });

  const end = (e) => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (e.type === 'pointerup' && down && !down.moved && ptrs.size === 0 && Date.now() - down.t < 600) {
      const d = down;
      down = null;
      tap(d.key, e.clientX, e.clientY);
      return;
    }
    if (ptrs.size === 0) down = null;
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  svg.addEventListener('lostpointercapture', end);

  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * 100 : e.deltaY;
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-dy * 0.0015));
  }, { passive: false });

  svg.addEventListener('dblclick', (e) => {
    const r = svg.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, 2);
  });

  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-z]');
    if (!b) return;
    const z = b.dataset.z;
    if (z === 'in') zoomAt(W / 2, H / 2, 1.6);
    else if (z === 'out') zoomAt(W / 2, H / 2, 1 / 1.6);
    else if (z === 'fit') fit(places);
    else if (z === 'world') { view.k = 1; view.cx = 0; view.cy = 0; draw(); }
  });

  new ResizeObserver(() => {
    const r = el.getBoundingClientRect();
    W = r.width;
    H = r.height;
    if (pendingFit && W) { const t = pendingFit; pendingFit = null; fit(t); } else draw();
  }).observe(el);

  return {
    el,
    setPlaces(list) { places = list; draw(); },
    fit,
    focus(p) { const { X, Y } = project(p.lat, p.lon); view.cx = X; view.cy = Y; view.k = Math.max(view.k, 5); draw(); },
    setPicked(ll) { picked = ll; draw(); },
    resetGesture() { ptrs.clear(); down = null; lastDist = 0; },
  };
}

/* ---------- render ---------- */

function visiblePlaces(all) { return all.filter((p) => mapFilter === 'all' || p.kind === mapFilter); }

function render() {
  const tabs = $('#tabs');
  if (!state) {
    $('#top').innerHTML = '';
    $('#view').innerHTML = onboardingHtml();
    tabs.hidden = true;
    return;
  }
  tabs.hidden = false;
  const right = tab === 'guide' ? '<button class="btn" data-act="tab" data-tab="you">Back</button>' : '<button class="btn" data-act="receive">Receive</button>';
  $('#top').innerHTML = `<div class="topbar"><h1>${TITLES[tab]}</h1>${right}</div>`;
  $('#view').innerHTML = views[tab]();
  const navTab = tab === 'guide' ? 'you' : tab;
  tabs.innerHTML = TABS.map(([id, label]) => `<button data-act="tab" data-tab="${id}"${id === navTab ? ' aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]}</svg>${label}</button>`).join('');
  if (tab === 'map') mountMap();
}

function mountMap() {
  const slot = $('#map-slot');
  if (!slot) return;
  const shown = visiblePlaces(Core.mapPlaces(state, EXAMPLES));
  mainMap.resetGesture();
  slot.appendChild(mainMap.el);
  mainMap.setPlaces(shown);
  const sig = shown.map((p) => p.key).join('|');
  if (mapNeedsFit || sig !== lastPlaceSig) { mapNeedsFit = false; lastPlaceSig = sig; mainMap.fit(shown); }
}

function onboardingHtml() {
  return `<section class="onboard">
    <p class="mark"><span class="mark-glyph"></span>Tessera</p>
    <h1>Share your place with people you have actually met.</h1>
    <p class="lead">A tessera was the token two hosts split in half as proof of a friendship. Here you list your flat, choose who sees it and on what terms, and connect by meeting in person.</p>
    ${notice ? `<p class="error">${esc(notice)}</p>` : ''}
    <form data-form="onboard" novalidate>
      <label>Your first name<input name="name" autocomplete="given-name" maxlength="40"></label>
      <p class="error" role="alert" hidden></p>
      <button class="btn primary block">Start</button>
    </form>
    <p class="fine">Everything stays on this device. You connect by scanning each other’s codes, and send updates as codes through any messenger.</p>
    <p class="fine">Have a backup? <button class="linkbtn" data-act="importbackup">Load it</button></p>
  </section>`;
}

/* ---------- sheets, picker, deck ---------- */

function openSheet(fn) {
  opener = document.activeElement;
  sheetView = fn;
  sheetOpenedAt = Date.now();
  paintSheet();
  $('#sheet').hidden = false;
  $('#sheet-body').focus();
}

function paintSheet() {
  stopScan();
  $('#sheet-body').innerHTML = sheetView();
  resumeScan(0);
}

// (Re)starts the camera if the open sheet has a scanner and it isn't running.
function resumeScan(delay = 1500) {
  setTimeout(() => {
    const v = $('#scan-video');
    if (!v || scanner || document.hidden) return;
    startScan((code) => onCode(code, true, $('#sheet-body form[data-form=paste]')));
  }, delay);
}

function closeSheet() {
  stopScan();
  sheetView = null;
  meet = null;
  outbox = null;
  $('#sheet').hidden = true;
  $('#sheet-body').innerHTML = '';
  if (opener && opener.focus) opener.focus();
}

function showSheet(fn) {
  if (sheetView) { sheetView = fn; paintSheet(); } else openSheet(fn);
}

function openPicker(initial, done) {
  const chosen = initial && Number.isFinite(initial.lat) && Number.isFinite(initial.lon) ? { lat: initial.lat, lon: initial.lon } : null;
  pickerState = { chosen, done };
  pickerMap = createMap({
    picker: true,
    onTap: (ll) => {
      if (!ll) { toast('Tap inside the outline of the map.'); return; }
      pickerState.chosen = ll;
      pickerMap.setPicked(ll);
      updatePickerFoot();
    },
  });
  $('#picker-map').replaceChildren(pickerMap.el);
  $('#picker').hidden = false;
  if (chosen) { pickerMap.setPicked(chosen); pickerMap.focus(chosen); } else pickerMap.fit([]);
  updatePickerFoot();
}

function updatePickerFoot() {
  const c = pickerState.chosen;
  $('#picker-ok').disabled = !c;
  $('#picker-hint').textContent = c ? `${c.lat.toFixed(2)}, ${c.lon.toFixed(2)} · about 5 km` : 'Tap the map to set the area.';
}

function closePicker() {
  $('#picker').hidden = true;
  $('#picker-map').replaceChildren();
  pickerMap = null;
  pickerState = null;
}

function openDeck() {
  if (typeof DECK_HTML === 'undefined' || !DECK_HTML) { toast('The deck isn’t embedded in this build.'); return; }
  const d = $('#deck');
  d.innerHTML = '<iframe title="Business idea" sandbox="allow-scripts"></iframe>';
  d.querySelector('iframe').srcdoc = DECK_HTML;
  d.hidden = false;
}

function closeDeck() {
  $('#deck').hidden = true;
  $('#deck').innerHTML = '';
}

/* ---------- sending codes ---------- */

// Shows a code as QR plus Share and Copy. onSent runs once the user has passed it on.
function sendCode(o) {
  const to = o.msg.to ? contactOf(o.msg.to) : null;
  outbox = { ...o, code: Core.encode(o.msg), done: false, test: !!(to && to.demo && testKey(to.id)) };
  showSheet(outboxHtml);
}

function outboxHtml() {
  const o = outbox;
  const fits = o.code.length <= QR_MAX;
  if (o.test) {
    const n = esc(TEST[testKey(o.msg.to)].name);
    return `<h2>${esc(o.title)}</h2>
      <p class="lead">${esc(o.lead)}</p>
      <p class="hint">${n} is a test person, so this code stays on your phone. ${n} answers in a moment, through the same Receive step a real code goes through.</p>
      ${fits ? `<div class="qrwrap">${qrSvg(o.code, 'QR code to scan')}</div>` : ''}
      <button class="btn primary block" data-act="outdeliver">Deliver to ${n}</button>
      <button class="btn quiet block" data-act="close">Cancel</button>`;
  }
  return `<h2>${esc(o.title)}</h2>
    <p class="lead">${esc(o.lead)}</p>
    ${fits ? `<div class="qrwrap">${qrSvg(o.code, 'QR code to scan')}</div>` : '<p class="hint">Too long for a QR code. Share or copy it instead.</p>'}
    <div class="row"><button class="btn primary" data-act="outshare">Share</button><button class="btn" data-act="outcopy">Copy</button></div>
    <details class="codetext"><summary>Show the code</summary><textarea readonly rows="3" spellcheck="false">${esc(o.code)}</textarea></details>
    <button class="btn quiet block" data-act="outdone">${esc(o.doneLabel || 'Done')}</button>`;
}

function outboxSent() {
  if (!outbox || outbox.done) return;
  outbox.done = true;
  if (outbox.onSent) outbox.onSent();
}

function shareBody(o) {
  return `Tessera message${o.forName ? ' for ' + o.forName : ''}. Open Tessera, tap Receive and paste this:\n\n${o.code}`;
}

function sendBundle(contactId, after) {
  const c = contactOf(contactId);
  const msg = c && Core.bundleMsg(state, contactId, Date.now());
  if (!msg) return;
  const n = msg.flats.length;
  sendCode({
    msg, forName: c.name,
    title: after ? `Now let ${firstName(c.name)} scan yours` : `Send your flats to ${firstName(c.name)}`,
    lead: (after ? `So ${firstName(c.name)} adds you too. ` : '') + (n
      ? `It holds the ${plural(n, 'flat', 'flats')} you share with the ${LABEL[c.circle]} circle. Arrival notes stay private until you accept a stay.`
      : `You share no flats with the ${LABEL[c.circle]} circle yet, so it only tells them who you are.`),
    onSent: () => commit(Core.markSent(state, contactId)),
  });
}

/* ---------- receiving codes ---------- */

function onCode(text, inPerson, form) {
  const d = Core.decode(text);
  if (d.error) { if (form) formError(form, d.error); else toast(d.error); resumeScan(); return; }
  const r = Core.receive(state, d.msg, inPerson);
  if (r.error) { if (form) formError(form, r.error); else toast(r.error); resumeScan(); return; }
  if (r.gate) { showSheet(() => gateHtml(r.gate)); return; }
  if (r.needsAdd) {
    const k = testKey(r.needsAdd.from.id);
    meet = { step: 'add', msg: r.needsAdd, intro: r.intro || null, circle: k === 'sam' ? 'friends' : k ? 'friends' : 'met' };
    showSheet(meetHtml);
    return;
  }
  const first = firstName(r.contact.name);
  if (r.kind === 'same') { closeSheet(); toast(`Already up to date with ${first}.`); return; }
  closeSheet();
  if (r.kind === 'bundle') {
    tab = 'stays';
    commit(r.state);
    toast(`${first}’s flats are updated.`);
  } else if (r.kind === 'request') {
    tab = 'flats';
    commit(r.state);
    toast(`${first} asks to stay. Answer under Your flats.`);
  } else if (r.kind === 'response') {
    tab = 'stays';
    commit(r.state);
    toast(`${first} ${r.request.status === 'accepted' ? 'accepted' : 'declined'} your request.`);
  } else if (r.kind === 'introreq') {
    tab = 'people';
    commit(r.state);
    toast(`${first} asks you to introduce them to ${firstName(r.about.name)}. See People.`);
  } else if (r.kind === 'intro') {
    tab = 'stays';
    commit(r.state);
    const by = firstName(r.contact.intro.byName);
    toast(r.renewed ? `${by} introduced you to ${first} again: ${Core.INTRO_DAYS} more days.` : `${by} introduced you to ${first}. You have ${Core.INTRO_DAYS} days to meet.`);
  }
  history.replaceState(null, '', '#' + tab);
  window.scrollTo(0, 0);
}

/* ---------- views ---------- */

const views = { map: viewMap, stays: viewStays, flats: viewFlats, people: viewPeople, you: viewYou, guide: viewGuide };

const relLabel = (rel, viaName) => {
  const f = firstName(viaName);
  return rel === 'family' ? `${f}’s family` : rel === 'friends' ? `${f}’s friend` : `someone ${f} met`;
};
const circleChip = (circle) => `<span class="chip c-${circle}">${circle === 'friends' ? 'Friend' : LABEL[circle]}</span>`;
const testChip = (c) => (c && c.demo ? '<span class="chip test">Test</span>' : '');
const metContacts = () => state.contacts.filter((c) => Core.isMet(c));
const introContacts = () => state.contacts.filter((c) => !Core.isMet(c));

function viewMap() {
  const shown = visiblePlaces(Core.mapPlaces(state, EXAMPLES));
  const hasVia = Core.secondDegree(state, Date.now()).length > 0;
  const chips = [['all', 'All'], ['mine', 'Mine'], ['shared', 'Met']].concat(hasVia ? [['via', 'Through']] : []).concat(state.showExamples ? [['example', 'Examples']] : [])
    .map(([id, l]) => `<button type="button" class="seg${mapFilter === id ? ' on' : ''}" aria-pressed="${mapFilter === id}" data-act="mapfilter" data-f="${id}">${l}</button>`).join('');
  const rows = shown.map((p, i) => placeRow(p, i + 1)).join('');
  const unlocated = Core.unlocated(state).map((f) => `<div class="row-index">
      <span class="no">–</span>
      <span class="body"><span class="area">No location yet</span><span class="ttl">${esc(f.title)}</span></span>
      <button class="btn" data-act="placeflat" data-id="${esc(f.id)}">Place on map</button></div>`).join('');
  const empty = shown.length || unlocated ? '' : '<p class="empty">No places yet. Add your flat and place it on the map, or meet someone who shares theirs.</p>';
  const hint = state.showExamples && !state.contacts.length ? '<p class="hint">The dashed places are examples. Places from people you meet show up here too.</p>' : '';
  return `<div class="segs">${chips}</div>
    <div id="map-slot" class="map-slot"></div>
    <p class="legend"><span><i class="mine"></i>Yours</span><span><i class="fam"></i>Family</span><span><i></i>Friends, met</span>${hasVia ? '<span><i class="via"></i>Through your people</span>' : ''}${state.showExamples ? '<span><i class="ex"></i>Example</span>' : ''}</p>
    ${hint}<div class="list">${rows}${unlocated}${empty}</div>`;
}

function locKind(p) { return p.kind === 'shared' && p.circle === 'family' ? 'shared family' : p.kind; }

function placeRow(p, n) {
  const t = esc(Core.formatTerms(p.terms));
  const sub = p.kind === 'mine' ? 'Yours'
    : p.kind === 'example' ? `Example · ${t}`
    : p.kind === 'via' ? `${esc(p.contactName)} · via ${esc(firstName(p.viaName))} · ${t}`
    : `${esc(p.contactName)} · ${p.circle === 'friends' ? 'Friend' : esc(LABEL[p.circle] || '')} · ${t}`;
  return `<button class="row-index" data-act="place" data-key="${esc(p.key)}">
    <span class="no">${pad2(n)}</span>
    <span class="body"><span class="area">${esc(p.area)}</span><span class="ttl">${esc(p.title)}</span><span class="sub">${sub}</span></span>
    ${locator(p.lat, p.lon, locKind(p))}
  </button>`;
}

function placeHtml(key) {
  const p = Core.mapPlaces(state, EXAMPLES).find((x) => x.key === key);
  if (!p) return '<p class="empty">This place is no longer available.</p><button class="btn block" data-act="close">Close</button>';
  const head = (label) => `<p class="label" style="margin-top:0">${label}</p>
    <div class="flat-top"><div><h2>${esc(p.title)}</h2><p class="meta">${esc(p.area)} · approximate area</p></div>${locator(p.lat, p.lon, locKind(p))}</div>`;
  if (p.kind === 'example') {
    return `${head('Example place')}
      <p class="terms">${esc(Core.formatTerms(p.terms))}</p>
      <p class="hint">A made-up place that shows how Tessera looks. You can’t request it. Real places appear when people you have met share theirs.</p>
      <button class="btn quiet block" data-act="close">Close</button>
      <button class="btn quiet block" data-act="toggleexamples">Hide examples</button>`;
  }
  if (p.kind === 'via') {
    const sd = Core.secondDegree(state, Date.now()).find((x) => x.owner.id === p.contactId);
    return `${head(`${esc(p.contactName)} · ${esc(relLabel(p.rel, p.viaName))}`)}
      <div class="foot"><span class="terms">${esc(Core.formatTerms(p.terms))}</span><span class="chip via">Through ${esc(firstName(p.viaName))}</span></div>
      ${sd ? viaActions(sd, p.flatId) : ''}
      <button class="btn quiet block" data-act="close">Close</button>`;
  }
  const action = p.kind === 'shared'
    ? `<div class="foot"><span class="terms">${esc(Core.formatTerms(p.terms))}</span>${circleChip(p.circle)}</div>
       <button class="btn primary block" data-act="request" data-c="${esc(p.contactId)}" data-f="${esc(p.flatId)}">Request stay</button>`
    : `<button class="btn block" data-act="editflat" data-id="${esc(p.flatId)}">Edit flat</button>`;
  return `${head(p.kind === 'mine' ? 'Your flat' : esc(p.contactName))}
    ${action}
    <button class="btn quiet block" data-act="close">Close</button>`;
}

// What you can do with a flat one step away, depending on the intro.
function viaActions(sd, flatId) {
  const via = firstName(sd.via.name);
  const owner = firstName(sd.owner.name);
  if (sd.status === 'active') {
    return `<p class="hint">${esc(via)} introduced you. ${plural(sd.daysLeft, 'day', 'days')} left to meet ${esc(owner)} and scan each other’s codes.</p>
      ${flatId ? `<button class="btn primary block" data-act="request" data-c="${esc(sd.owner.id)}" data-f="${esc(flatId)}">Request stay</button>` : ''}`;
  }
  if (sd.status === 'expired') {
    return `<p class="hint">The intro ran out. Meet ${esc(owner)} and scan each other’s codes, or ask ${esc(via)} to introduce you again for another ${Core.INTRO_DAYS} days.</p>
      <button class="btn block" data-act="askintro" data-via="${esc(sd.via.id)}" data-o="${esc(sd.owner.id)}">Ask ${esc(via)} again</button>`;
  }
  return `<p class="hint">You haven’t met ${esc(owner)}. ${esc(via)} can introduce you. Then you have ${Core.INTRO_DAYS} days to stay in touch directly and meet in person.</p>
    ${sd.asked ? `<p class="meta">You asked ${esc(via)} on ${Core.formatDay(sd.asked.at)}.</p>` : ''}
    <button class="btn ${sd.asked ? '' : 'primary'} block" data-act="askintro" data-via="${esc(sd.via.id)}" data-o="${esc(sd.owner.id)}">${sd.asked ? 'Ask again' : `Ask ${esc(via)} to introduce you`}</button>`;
}

function exampleSection() {
  if (!state.showExamples) return '';
  const people = EXAMPLES.map((p) => `<div class="exgroup"><p class="area">${esc(p.city)} · ${esc(p.name)}</p>${p.flats.map((f) => `<article class="flat example">
      <div class="flat-top"><div><span class="area">${esc(f.area)}</span><h3>${esc(f.title)}</h3></div>${locator(f.lat, f.lon, 'example')}</div>
      <p>${esc(f.desc)}</p>
      ${pips(f.rooms, f.beds)}
      <p class="meta">Available: ${esc(f.avail)}</p>
      <div class="foot"><span class="terms">${esc(Core.formatTerms(f.terms))}</span><span class="chip">Example</span></div>
    </article>`).join('')}</div>`).join('');
  return `<section class="person"><div class="person-head"><h2>Examples</h2><p class="meta">Made-up places, to show how it looks.</p></div>${people}
    <button class="btn quiet block" data-act="toggleexamples">Hide examples</button></section>`;
}

function viewStays() {
  const now = Date.now();
  const met = metContacts();
  const sd = Core.secondDegree(state, now);
  let html = '';
  if (!met.length) {
    html += `<p class="lead">Nobody yet. Meet someone and the flats they share with you show up here.</p><button class="btn primary block" data-act="meet">Meet someone</button>
      <p class="fine">Want to try it first? <button class="linkbtn" data-act="practice">Practise with test people</button></p>`;
  } else {
    html += `<p class="label" style="margin-top:0">People you’ve met</p>` + met.map((c) => {
      const shared = Core.sharedBy(c);
      const body = shared.length
        ? shared.map((x) => stayRow(c, x, c.circle)).join('')
        : `<p class="empty">${esc(firstName(c.name))} hasn’t shared a flat with you yet. When they send you their flats, tap Receive.</p>`;
      return `<section class="person"><div class="person-head"><h2>${esc(c.name)} ${circleChip(c.circle)}${testChip(c)}</h2><p class="meta">${metLine(c)}</p></div>${body}</section>`;
    }).join('');
  }
  if (sd.length) {
    html += `<p class="label">Through your people</p><p class="hint" style="margin-top:0">People you haven’t met, whose flats your people may pass on. You need an intro to ask for a stay.</p>`
      + sd.map((x) => `<section class="person via"><div class="person-head"><h2>${esc(x.owner.name)} <span class="chip via">via ${esc(firstName(x.via.name))}</span>${testChip(x.via)}</h2>
        <p class="meta">${esc(relLabel(x.rel, x.via.name))}${x.status === 'active' ? ` · introduced · ${plural(x.daysLeft, 'day', 'days')} left` : x.status === 'expired' ? ' · intro ran out' : ''}</p></div>
        ${x.flats.map((f) => viaRow(x, f)).join('')}
        ${viaActions(x, null)}
      </section>`).join('');
  }
  const reqs = state.requests.length
    ? `<section class="person" id="requests"><div class="person-head"><h2>Your requests</h2></div>${state.requests.map(requestRow).join('')}</section>`
    : '';
  return html + reqs + exampleSection();
}

function stayRow(c, { flat, terms }, circle) {
  return `<article class="flat c-${circle}">
    <div class="flat-top"><div><span class="area">${esc(flat.area)}</span><h3>${esc(flat.title)}</h3></div>${Number.isFinite(flat.lat) ? locator(flat.lat, flat.lon, circle === 'family' ? 'shared family' : 'shared') : ''}</div>
    ${flat.desc ? `<p>${esc(flat.desc)}</p>` : ''}
    ${pips(flat.rooms, flat.beds)}
    ${flat.avail ? `<p class="meta">Available: ${esc(flat.avail)}</p>` : ''}
    <div class="foot"><span class="terms">${esc(Core.formatTerms(terms))}</span>
    <button class="btn" data-act="request" data-c="${esc(c.id)}" data-f="${esc(flat.id)}">Request stay</button></div>
  </article>`;
}

function viaRow(x, flat) {
  return `<article class="flat via">
    <div class="flat-top"><div><span class="area">${esc(flat.area)}</span><h3>${esc(flat.title)}</h3></div>${Number.isFinite(flat.lat) ? locator(flat.lat, flat.lon, 'via') : ''}</div>
    ${flat.desc ? `<p>${esc(flat.desc)}</p>` : ''}
    ${pips(flat.rooms, flat.beds)}
    ${flat.avail ? `<p class="meta">Available: ${esc(flat.avail)}</p>` : ''}
    <div class="foot"><span class="terms">${esc(Core.formatTerms(flat.terms))}</span>
    ${x.status === 'active' ? `<button class="btn" data-act="request" data-c="${esc(x.owner.id)}" data-f="${esc(flat.id)}">Request stay</button>` : `<span class="chip via">Needs intro</span>`}</div>
  </article>`;
}

function requestRow(r) {
  const c = contactOf(r.contactId);
  const n = Core.nights(r.from, r.to);
  const status = { pending: 'Waiting for an answer', accepted: 'Accepted', declined: 'Declined' }[r.status];
  return `<article class="request">
    <p><strong>${esc(r.flatTitle)}</strong> · ${esc(c ? c.name : '')}</p>
    <p class="meta">${Core.formatDay(r.from)} to ${Core.formatDay(r.to)} · ${plural(n, 'night', 'nights')} · ${plural(r.guests, 'guest', 'guests')}</p>
    <p class="status ${r.status}">${status}</p>
    ${r.reply ? `<p class="quote">“${esc(r.reply)}”</p>` : ''}
    ${r.status === 'accepted' && r.arrival ? `<div class="arrival"><p class="meta">Arrival notes</p><p>${esc(r.arrival)}</p></div>` : ''}
    ${r.status === 'pending' ? `<div class="row"><button class="btn" data-act="resendrequest" data-id="${esc(r.id)}">Send again</button></div>` : ''}
  </article>`;
}

function viewFlats() {
  const add = '<button class="btn primary block" data-act="addflat">Add a flat</button>';
  if (!state.flats.length) {
    return `<p class="lead">No flats yet. Add one and choose who sees it. Nothing is visible to anyone until you set terms.</p>${add}`;
  }
  const stale = state.contacts.filter((c) => Core.needsUpdate(state, c)).length;
  const hint = stale ? `<p class="hint">${plural(stale, 'person has', 'people have')} an older version of your flats. Send updates under People.</p>` : '';
  return add + hint + `<div class="list" style="margin-top:20px">${state.flats.map(myFlat).join('')}</div>`;
}

function throughLine(f) {
  const t = Core.termsFor(f, 'through');
  const pass = f.passOn || [];
  if (!Core.isShared(t) || !pass.length) return '';
  return `Through my ${pass.map((c) => LABEL[c]).join(', ')}: ${Core.formatTerms(t).toLowerCase()}`;
}

function myFlat(f) {
  const line = Core.CIRCLES.map((c) => `${LABEL[c]} ${Core.formatTerms(Core.termsFor(f, c)).toLowerCase()}`).join(' · ');
  const priv = Core.CIRCLES.every((c) => !Core.isShared(Core.termsFor(f, c)));
  const th = throughLine(f);
  const inc = state.incoming.filter((r) => r.flatId === f.id).map((r) => incomingRow(r, f)).join('');
  const loc = Number.isFinite(f.lat) ? locator(f.lat, f.lon, 'mine') : '';
  return `<article class="myflat">
    <div class="flat-top"><div><span class="area">${esc(f.area)}</span><h3>${esc(f.title)}</h3></div>${loc}</div>
    <p class="meta">${priv ? 'Private. Nobody sees this.' : esc(line)}</p>
    ${th ? `<p class="meta">${esc(th)}</p>` : ''}
    ${f.desc ? `<p>${esc(f.desc)}</p>` : ''}
    ${pips(f.rooms, f.beds)}
    ${Number.isFinite(f.lat) ? '' : '<p class="meta">No location yet. Edit the flat to place it on the map.</p>'}
    <div class="row"><button class="btn" data-act="editflat" data-id="${esc(f.id)}">Edit</button></div>
    ${inc}
  </article>`;
}

function incomingRow(r, f) {
  const n = Core.nights(r.from, r.to);
  const c = contactOf(r.contactId);
  const who = c && !Core.isMet(c) ? ` <span class="chip via">via ${esc(firstName(c.intro.byName))}</span>` : '';
  const foot = r.status === 'pending'
    ? `<div class="row"><button class="btn primary" data-act="answer" data-id="${esc(r.id)}" data-d="accepted">Accept</button><button class="btn" data-act="answer" data-id="${esc(r.id)}" data-d="declined">Decline</button></div>`
    : `<p class="status ${r.status}">${r.status === 'accepted' ? (f.arrival ? 'Accepted, with your arrival notes' : 'Accepted') : 'Declined'}</p>
       ${r.reply ? `<p class="quote">“${esc(r.reply)}”</p>` : ''}
       <div class="row"><button class="btn" data-act="resendanswer" data-id="${esc(r.id)}">Send answer again</button></div>`;
  return `<div class="request">
    <p><strong>${esc(r.name)}</strong>${who} asks to stay</p>
    <p class="meta">${Core.formatDay(r.from)} to ${Core.formatDay(r.to)} · ${plural(n, 'night', 'nights')} · ${plural(r.guests, 'guest', 'guests')}</p>
    ${r.msg ? `<p class="quote">“${esc(r.msg)}”</p>` : ''}
    ${foot}
  </div>`;
}

function viewPeople() {
  const now = Date.now();
  const asks = state.introAsks.map((a) => {
    const asker = contactOf(a.contactId);
    if (!asker) return '';
    return `<div class="request"><p><strong>${esc(asker.name)}</strong> asks you to introduce them to <strong>${esc(a.aboutName)}</strong></p>
      <p class="meta">${a.doneAt ? `Introduced on ${Core.formatDay(a.doneAt)}` : `Asked on ${Core.formatDay(a.createdAt)}`}</p>
      <div class="row"><button class="btn ${a.doneAt ? '' : 'primary'}" data-act="introduce" data-id="${esc(a.id)}">${a.doneAt ? 'Introduce again' : 'Introduce'}</button></div></div>`;
  }).join('');
  const list = metContacts().map((c) => `<button class="row-btn" data-act="contact" data-id="${esc(c.id)}">
      <span><span class="name">${esc(c.name)}</span><span class="meta block">${metLine(c)}</span></span>
      <span class="chips">${testChip(c)}${Core.needsUpdate(state, c) ? '<span class="chip blue">Update</span>' : ''}${circleChip(c.circle)}</span></button>`).join('');
  const intros = introContacts().map((c) => {
    const on = Core.introActive(c, now);
    return `<button class="row-btn" data-act="contact" data-id="${esc(c.id)}">
      <span><span class="name">${esc(c.name)}</span><span class="meta block">Introduced by ${esc(c.intro.byName)} · ${on ? plural(Core.introDaysLeft(c, now), 'day', 'days') + ' left to meet' : 'ran out'}</span></span>
      <span class="chips">${testChip(c)}<span class="chip via">${on ? 'Intro' : 'Expired'}</span></span></button>`;
  }).join('');
  return `<button class="btn primary block" data-act="meet">Meet someone</button>
    ${asks ? `<p class="label">Introductions</p>${asks}` : ''}
    <p class="label">Met</p>
    <div class="list">${list || '<p class="empty">Nobody yet. Meet someone in person and scan each other’s codes.</p>'}</div>
    ${intros ? `<p class="label">Introduced, not met yet</p><div class="list">${intros}</div>` : ''}
    <p class="fine">Got a code from someone you know? Tap Receive at the top.${state.contacts.some((c) => c.demo) ? '' : ' Want to try it first? <button class="linkbtn" data-act="practice">Practise with test people</button>'}</p>`;
}

function viewYou() {
  const last = state.backupAt ? Core.formatDay(state.backupAt) : 'never';
  const tests = state.contacts.filter((c) => c.demo);
  const testIntro = tests.some((c) => !Core.isMet(c) && Core.introActive(c, Date.now()));
  return `<p class="label" style="margin-top:0">Name</p>
    <form data-form="name" class="inline" novalidate><input name="name" maxlength="40" value="${esc(state.me.name)}" aria-label="Your name"><button class="btn">Save</button><p class="error" role="alert" hidden></p></form>
    <p class="meta">ID ${esc(state.me.id)}</p>
    <p class="label">How it works</p>
    <div class="list"><button class="row-btn" data-act="tab" data-tab="guide"><span><span class="name">How Tessera works</span><span class="meta block">Architecture, meeting, codes, circles and intros, as diagrams</span></span><span class="chip">Open</span></button></div>
    <p class="label">Backup</p>
    <p class="hint" style="margin-top:0">Your data lives only on this device. Last backup: ${esc(last)}.</p>
    <div class="row"><button class="btn primary" data-act="savebackup">Save backup</button><button class="btn" data-act="importbackup">Load backup</button></div>
    <p class="label">Test people</p>
    <p class="hint" style="margin-top:0">Made-up people to practise with: Sam to meet as a friend, his sister Lea and his friend Jonas through him, and Dad in your family. Codes you send them stay on this phone.</p>
    <button class="btn block" data-act="practice">Practise meeting</button>
    ${tests.some((c) => c.id === TEST.dad.id) ? '' : '<button class="btn block" data-act="adddad">Add Dad to your family</button>'}
    ${testIntro ? '<button class="btn block" data-act="expireintros">Let test intros run out</button>' : ''}
    ${tests.length ? '<button class="btn danger block" data-act="removetests">Remove test people</button>' : ''}
    <p class="label">Example places</p>
    <p class="hint" style="margin-top:0">Made-up flats in Berlin, Paris, New York, Milan, Barcelona, Lisbon, Vienna and Copenhagen. They are never saved in your data or sent to anyone.</p>
    <button class="btn block" data-act="toggleexamples">${state.showExamples ? 'Hide example places' : 'Show example places'}</button>
    <p class="label">Business idea</p>
    <div class="list"><button class="row-btn" data-act="deck"><span><span class="name">The idea as a deck</span><span class="meta block">Canvas, architecture, journey, roadmap and the ask</span></span><span class="chip">Open</span></button></div>
    <p class="label">How it works today</p>
    <p class="hint" style="margin-top:0">Codes are not signed or encrypted yet. Anyone holding a code can read it, so send each code only to the person it is for. Arrival notes are only sent when you accept a stay.</p>
    <button class="btn danger block" data-act="clear">Clear all data</button>`;
}

/* ---------- sheet contents ---------- */

function circleRadios(sel) {
  return CIRCLES.map((k) => `<label class="seg-label"><input type="radio" name="circle" value="${k}"${k === sel ? ' checked' : ''}><span class="seg">${LABEL[k]}</span></label>`).join('');
}

function meetHtml() {
  if (meet.step === 'add') {
    const m = meet.msg;
    const n = Array.isArray(m.flats) ? m.flats.length : 0;
    const intro = meet.intro;
    return `<form data-form="meetadd" novalidate>
      <h2>You met ${esc(m.from.name)}</h2><p class="meta">ID ${esc(m.from.id)}${n ? ' · shares ' + plural(n, 'flat', 'flats') + ' with you' : ''}</p>
      ${intro ? `<p class="hint">${esc(intro.intro.byName)} introduced you. Adding ${esc(firstName(m.from.name))} now makes the connection permanent.</p>` : ''}
      <p class="label">Put them in a circle</p><div class="segs">${circleRadios(meet.circle || 'met')}</div>
      <label>Note<input name="note" maxlength="60" placeholder="Where you met"></label>
      <p class="hint">Circles are private. They decide which of your flats ${esc(firstName(m.from.name))} sees, and on what terms.</p>
      <button class="btn primary block">Add to people</button>
      <button type="button" class="btn quiet block" data-act="close">Cancel</button>
    </form>`;
  }
  if (meet.step === 'scan') {
    return `<h2>Scan their code</h2>
      <p class="lead">Ask them to open Meet someone and hold up their code.</p>
      ${scanBox('meet')}
      <button class="btn quiet block" data-act="meet">Back to my code</button>`;
  }
  return `<h2>Meet someone</h2>
    <p class="lead">One of you shows this code, the other scans it. Then the app shows a code to scan back, so you both have each other.</p>
    <div class="qrwrap">${qrSvg(Core.encode(Core.cardMsg(state, Date.now())), 'QR code with your name and ID')}</div>

    <button class="btn primary block" data-act="meetscan">Scan their code</button>
    <button class="btn quiet block" data-act="close">Close</button>`;
}

function receiveHtml() {
